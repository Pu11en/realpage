# Free local web search for research sessions in this repo (lead finder, client map).
# Local harness only -- never part of the deployed site or chatbot.
# Start: docker compose -f tooling/searxng/docker-compose.yml up -d
# Use:   python3 tooling/searx_search.py "query"   (JSON API on http://127.0.0.1:8888)
services:
  searxng:
    image: searxng/searxng:latest
    container_name: ps-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
