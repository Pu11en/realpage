<!doctype html>
<!--
  Stand-in for Open WebUI, used only by tests (tooling/qa/check-panel.sh).
  Mimics the two states the real app has: a login screen, and a signed-in
  chat screen. Real Open WebUI has no custom-JS hook (checked in W3), so the
  actual Google sign-in click can't be intercepted from inside the frame --
  the panel (site/js/chat-panel.js) handles it instead, by opening this same
  URL as a top-level popup (where Google is willing to load) and reloading
  the framed copy once the popup closes. This page mimics both roles: the
  framed "login screen" that posts its auth state to the panel, and the
  popup's "Continue with Google" screen that flips the shared signed-in flag.
-->
<html>
<head>
<meta charset="utf-8">
<title>fake-webui</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 16px; }
  #login, #chat { display: none; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
  <div id="login">
    <button id="signin">Continue with Google</button>
  </div>
  <div id="chat">
    <div id="messages"></div>
    <input id="msg-input" placeholder="Ask a question">
    <button id="send">Send</button>
  </div>

<script>
  // localStorage (not sessionStorage) so the flag is visible both to this
  // page when framed and to this same page reopened as a top-level popup --
  // standing in for the real cookie that Open WebUI's backend would set.
  const signedIn = localStorage.getItem("fake-webui.signedIn") === "1";

  function postAuthState(v) {
    parent.postMessage({ source: "fake-webui", type: "auth-state", signedIn: v }, "*");
  }

  function showChat() {
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "block";
    postAuthState(true);
  }

  function showLogin() {
    document.getElementById("login").style.display = "block";
    document.getElementById("chat").style.display = "none";
    postAuthState(false);
  }

  if (signedIn) showChat(); else showLogin();

  document.getElementById("signin").addEventListener("click", () => {
    localStorage.setItem("fake-webui.signedIn", "1");
    if (window.opener) window.close();
    else location.reload();
  });

  document.getElementById("send").addEventListener("click", () => {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text) return;
    const messages = document.getElementById("messages");
    messages.innerHTML += `<div class="msg">You: ${text}</div><div class="msg">Bot: (fake) ${text}</div>`;
    input.value = "";
  });
</script>
</body>
</html>
