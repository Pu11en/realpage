<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>CraneSignal -- Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-panel.css" />
  <style>
    .map-wrap { position: relative; max-width: 1000px; }
    #us-map { width: 100%; height: auto; display: block; }
    #us-map .state { fill: #18181b; stroke: #3f3f46; stroke-width: 0.6; }
    #us-map .state[data-count] { cursor: default; }
    #us-map .state:hover { stroke: var(--text-muted); stroke-width: 1.2; }
    #map-tip {
      position: absolute; pointer-events: none; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; font-size: 13px; min-width: 150px;
    }
    #map-tip[hidden] { display: none; }
    #map-tip strong { display: block; }
    #map-tip .count { color: var(--accent); margin: 2px 0 4px; }
    #map-tip ul { margin: 0; padding-left: 16px; color: var(--text-muted); }
    .map-legend { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 12px; margin: 8px 0 16px; }
    .map-legend .ramp { width: 120px; height: 10px; border-radius: 2px;
      background: linear-gradient(to right, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 1)); }
  </style>
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script src="js/chat-panel.js"></script>
  <script src="vendor/d3-array.min.js"></script>
  <script src="vendor/d3-geo.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script>
    renderShell("map");
    document.getElementById("page-content").innerHTML = `
      <h1>Where RealPage already has clients</h1>
      <div class="meta">Apartment buildings whose own website links to a RealPage resident login, found in the 15 states building the most apartments. Brighter green = more buildings found. Point at a state for its count and top cities.</div>
      <div class="map-legend"><span>fewer</span><span class="ramp"></span><span>more RealPage buildings</span></div>
      <div class="map-wrap">
        <svg id="us-map" viewBox="0 0 975 610" role="img" aria-label="US map shaded by RealPage buildings found per state"></svg>
        <div id="map-tip" hidden></div>
      </div>
    `;
  </script>
  <script src="js/map.js"></script>
</body>
</html>
