<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="description" content="CraneSignal: apartment buildings about to pick software or change owners, with who to call and why now. Free.">
  <title>CraneSignal -- Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-panel.css" />
  <style>
    .map-wrap { position: relative; max-width: 1000px; }
    .area-req { max-width: 1000px; margin: 28px 0 0; padding: 18px 20px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper-2); }
    .area-req h2 { font-size: 18px; margin: 0 0 4px; }
    .area-req p { margin: 0 0 12px; color: var(--text-muted); font-size: 14px; }
    .area-req form { display: flex; flex-wrap: wrap; gap: 8px; }
    .area-req input { flex: 1 1 220px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font: inherit; font-size: 14px; }
    .area-req input[name="website"] { display: none; }
    .area-req button { background: var(--amber); color: var(--ink); font-weight: 800; font-family: var(--font-head); border: none; border-radius: 4px; padding: 10px 18px; cursor: pointer; box-shadow: 0 3px 0 #b88900; }
    .area-req .done { margin-top: 10px; font-weight: 600; color: var(--ink); }
    #us-map { width: 100%; height: auto; display: block; }
    #us-map .state { fill: var(--paper-2); stroke: var(--rule); stroke-width: 0.8; }
    #us-map .state[data-count] { cursor: default; }
    #us-map .state:hover { stroke: var(--ink-2); stroke-width: 1.2; }
    #map-tip {
      position: absolute; pointer-events: none; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 150px; color: var(--ink);
      box-shadow: 0 4px 16px rgba(14, 19, 32, 0.12);
    }
    #map-tip[hidden] { display: none; }
    #map-tip strong { display: block; font-family: var(--font-head); }
    #map-tip .count { color: var(--accent); margin: 2px 0 4px; }
    #map-tip ul { margin: 0; padding-left: 16px; color: var(--text-muted); }
    .map-legend { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 12px; margin: 8px 0 16px; }
    .map-legend .ramp { width: 120px; height: 10px; border-radius: 2px;
      background: linear-gradient(to right, rgba(26, 61, 143, 0.12), rgba(26, 61, 143, 1)); border: 1px solid var(--rule); }
    #us-map .lead-marker { cursor: pointer; }
    #us-map .lead-marker circle { fill: var(--amber); stroke: var(--ink); stroke-width: 1.5; }
    #us-map .lead-marker text { fill: var(--ink); font-family: var(--font-head); font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
    #us-map .lead-marker .label-pill { fill: var(--paper); stroke: var(--rule); stroke-width: 1; filter: drop-shadow(0 1px 2px rgba(14, 19, 32, 0.25)); }
    #us-map .lead-marker:hover circle, #us-map .lead-marker:focus circle { fill: var(--amber-2); }
    #us-map .lead-marker:focus { outline: none; }
    #us-map .lead-marker:focus-visible circle { stroke: var(--blue); stroke-width: 3; }
    #map-tip .lead-count { color: var(--warn); font-weight: 600; }
    #map-tip .hint { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
    .map-legend .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); border: 1.5px solid var(--ink); margin-left: 16px; }
  </style>
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script src="js/chat-panel.js"></script>
  <script src="vendor/d3-array.min.js"></script>
  <script src="vendor/d3-geo.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script>
    renderShell("map");
    document.getElementById("page-content").innerHTML = `
      <h1>Apartment buildings by software</h1>
      <div class="meta">The states we cover so far. Click one to see its apartment buildings: new builds, opening soon and recently sold.</div>
      <div class="map-legend"><span class="dot"></span><span>Click a highlighted state to see its leads. Grey states aren't covered yet — <a href="#request-area">ask for yours</a>.</span></div>
      <div class="map-wrap">
        <svg id="us-map" viewBox="0 0 975 610" role="img" aria-label="US map shaded by apartment buildings with detected software per state"></svg>
        <div id="map-tip" hidden></div>
      </div>
      <section class="area-req" id="request-area">
        <h2>Don't see your area?</h2>
        <p>Tell us the city or county and we'll add its buildings.</p>
        <form id="area-form">
          <input name="area" required maxlength="120" placeholder="City or county, state (e.g. Tulsa, OK)" aria-label="Area">
          <input name="email" type="email" maxlength="200" placeholder="Email (optional, we'll tell you when it's ready)" aria-label="Email (optional)">
          <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit">Ask for it</button>
        </form>
        <div class="done" id="area-done" hidden></div>
      </section>
    `;
    // Area requests go to the landing server (it saves them and posts to the sign-ups Discord channel).
    (function () {
      const local = ["localhost", "127.0.0.1"].includes(location.hostname);
      const endpoint = local ? "http://localhost:8791/api/signup" : "https://cranesignal.com/api/signup";
      const form = document.getElementById("area-form"), done = document.getElementById("area-done");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const data = new URLSearchParams(new FormData(form));
        data.set("source", "area-request");
        const btn = form.querySelector("button"); btn.disabled = true;
        fetch(endpoint, { method: "POST", body: data })
          .then((r) => { if (!r.ok) throw new Error(r.status); done.textContent = "Got it. We'll add " + data.get("area") + "."; form.reset(); })
          .catch(() => { done.textContent = "Sorry, that didn't go through. Please try again."; })
          .finally(() => { done.hidden = false; btn.disabled = false; });
      });
      if (location.hash === "#request-area") setTimeout(() => document.getElementById("request-area").scrollIntoView({ behavior: "smooth" }), 300);
    })();
  </script>
  <script src="js/map.js"></script>
</body>
</html>
