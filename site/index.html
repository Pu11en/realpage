<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PropertyStack -- Early Leads</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script>
    renderShell("leads");

    loadData("data/leads.json").then((data) => {
      const content = document.getElementById("page-content");
      const s = data.stats;
      content.innerHTML = `
        <h1>Early Leads</h1>
        <div class="meta">Who's about to choose -- upcoming buildings + recently sold.</div>
        ${placeholderBanner(data.status)}
        <div class="stats-row">
          <div class="stat-card"><div class="value">${s.leads}</div><div class="label">Leads</div></div>
          <div class="stat-card"><div class="value">${s.newThisWeek}</div><div class="label">New this week</div></div>
          <div class="stat-card"><div class="value">${s.unitsInPlay.toLocaleString()}</div><div class="label">Units in play</div></div>
          <div class="stat-card"><div class="value">${s.openingNext12mo.toLocaleString()}</div><div class="label">Opening next 12mo</div></div>
        </div>
        <div class="filters">
          <input placeholder="Search" />
          <select><option>All signals</option><option>Upcoming</option><option>Recently sold</option></select>
          <select><option>All cities</option></select>
          <select><option>All software</option></select>
          <label style="display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;">
            <input type="checkbox" /> hide properties already on my software
          </label>
        </div>
        <table>
          <thead>
            <tr><th>Rank</th><th>Score</th><th>Property</th><th>City</th><th>Units</th><th>Signal</th><th>Software</th><th>Why</th></tr>
          </thead>
          <tbody>
            ${data.leads.map((l, i) => `
              <tr>
                <td>${i + 1}</td>
                <td><span class="score-badge" style="background:${scoreBadgeColor(l.score)}">${l.score}</span></td>
                <td><strong>${l.property}</strong> ${l.isNew ? '<span class="pill" style="background:#22c55e22;color:#22c55e;">NEW</span>' : ""}</td>
                <td>${l.city}</td>
                <td>${l.units}</td>
                <td><span class="pill" style="background:#3f3f4622;color:#a1a1aa;">${l.signalType}: ${l.signal}</span></td>
                <td>${vendorPill(l.software)}</td>
                <td style="color:var(--text-muted);">${l.why} <span style="color:var(--text-dim);">${l.sources.map(s => `[${s}]`).join(" ")}</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    });
  </script>
</body>
</html>
