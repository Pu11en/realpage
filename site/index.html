<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>CraneSignal -- Early Leads</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-panel.css" />
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script src="js/chat-panel.js"></script>
  <script>
    renderShell("leads");

    const content = document.getElementById("page-content");

    let aliases = {};
    async function loadAreas() {
      try {
        const m = await loadData("data/areas/index.json");
        aliases = m.aliases || {};
        return m.areas;
      } catch (e) {
        return [{ slug: "plano-richardson", label: "Plano–Richardson", dataPath: "data/leads.json" }];
      }
    }

    // ?area=<state> opens that state; an older area now shown inside a state
    // (e.g. plano-richardson) opens that state instead.
    function pickInitialSlug(areas) {
      let wanted = new URLSearchParams(location.search).get("area");
      if (wanted && aliases[wanted]) wanted = aliases[wanted];
      if (wanted && areas.some((a) => a.slug === wanted)) return wanted;
      return areas[0].slug;
    }

    loadAreas().then((areas) => {
      const slug = pickInitialSlug(areas);
      const area = areas.find((a) => a.slug === slug) || areas[0];
      renderPage(areas, area);
    });

    function renderPage(areas, area) {
    loadData(area.dataPath).then((data) => {
      const s = Object.assign({ leads: 0, newThisWeek: 0, unitsInPlay: 0, openingNext12mo: 0 }, data.stats);
      const cities = [...new Set(data.leads.map((l) => l.city))].sort();
      const softwareOptions = [...new Set(data.leads.map((l) => l.software).filter(Boolean))].sort();

      content.innerHTML = `
        <h1>Early Leads</h1>
        <div class="meta">Who's about to choose -- upcoming buildings + recently sold.</div>
        <div class="pick-row"><span class="pick-label">State</span>${renderAreaButtons(areas, area.slug)}</div>
        ${(data.metros || []).length ? `<div class="pick-row"><span class="pick-label">Region</span><div class="metro-buttons">
          <button class="metro-btn active" data-metro="">All ${area.label} (${data.leads.length})</button>
          ${data.metros.map((m) => `<button class="metro-btn" data-metro="${m.name}">${m.name} (${m.leads})</button>`).join("")}
        </div></div>` : ""}
        ${placeholderBanner(data.status)}
        <div class="stats-row">
          <div class="stat-card"><div class="value">${s.leads}</div><div class="label">Leads</div></div>
          <div class="stat-card"><div class="value">${s.newThisWeek}</div><div class="label">New</div></div>
          <div class="stat-card"><div class="value">${s.unitsInPlay.toLocaleString()}</div><div class="label">Units in play</div></div>
          <div class="stat-card"><div class="value">${s.openingNext12mo.toLocaleString()}</div><div class="label">Opening soon</div></div>
        </div>

        <div class="filters">
          <input id="f-search" placeholder="Search property" />
          <select id="f-signal">
            <option value="">All signals</option>
            <option value="Upcoming">Upcoming</option>
            <option value="Leasing">Leasing now</option>
            <option value="Planned">Planned</option>
            <option value="Sold">Recently sold</option>
          </select>
          <select id="f-city"></select>
          <select id="f-software">
            <option value="">All software</option>
            <option value="__none__">Not chosen yet</option>
            ${softwareOptions.map((v) => `<option value="${v}">${v}</option>`).join("")}
          </select>
          <select id="f-sort">
            <option value="score">Sort: score</option>
            <option value="size">Sort: size (units)</option>
            <option value="newest">Sort: newest</option>
          </select>
          <label style="display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;">
            <input type="checkbox" id="f-hide-mine" /> hide properties already on my software
          </label>
        </div>
        <table class="leads-table">
          <thead>
            <tr><th>Rank</th><th>Score</th><th>Property</th><th>City</th><th>Units</th><th>Signal</th><th>Software</th><th>Why</th></tr>
          </thead>
          <tbody id="leads-tbody"></tbody>
        </table>
      `;

      function contactHtml(contact) {
        if (!contact) return "";
        const parts = [];
        if (contact.phone) parts.push(contact.phone);
        if (contact.email) parts.push(contact.email);
        return parts.length ? `<div class="lead-contact">${parts.join(" · ")}</div>` : "";
      }

      // "Sold Jun 2026" + type "Sold" shouldn't read "Sold: Sold Jun 2026".
      function signalHtml(l) {
        const sold = l.signalType === "Sold";
        const text = sold ? l.signal.replace(/^Sold\s*/i, "") : l.signal;
        const tag = l.signalType === "Leasing" ? "Leasing now" : l.signalType;
        return `<span class="sig-tag ${sold ? "sig-sold" : "sig-up"}">${tag}</span> <span class="sig-text">${text}</span>`;
      }

      // Upcoming = nothing picked yet; a sold building with no software found = unknown.
      function leadSoftwareHtml(l) {
        if (!l.software && l.signalType === "Sold") return `<span class="pill" style="background:#27272a;color:#a1a1aa;">Unknown</span>`;
        return vendorPill(l.software);
      }

      function renderRows() {
        const search = document.getElementById("f-search").value.trim().toLowerCase();
        const signal = document.getElementById("f-signal").value;
        const city = document.getElementById("f-city").value;
        const metro = (document.querySelector(".metro-btn.active") || {}).dataset?.metro || "";
        const software = document.getElementById("f-software").value;
        const sort = document.getElementById("f-sort").value;
        const hideMine = document.getElementById("f-hide-mine").checked;
        const viewAs = getViewAs();

        let rows = data.leads.filter((l) => {
          if (search && !l.property.toLowerCase().includes(search)) return false;
          if (signal && l.signalType !== signal) return false;
          if (city && l.city !== city) return false;
          if (metro && l.metro !== metro) return false;
          if (software === "__none__" && l.software) return false;
          if (software && software !== "__none__" && l.software !== software) return false;
          if (hideMine && viewAs !== "Neutral" && l.software === viewAs) return false;
          return true;
        });

        if (sort === "size") {
          rows = rows.slice().sort((a, b) => (b.units || 0) - (a.units || 0));
        } else if (sort === "newest") {
          rows = rows.slice().sort((a, b) => (b.isNew === a.isNew ? b.score - a.score : b.isNew ? 1 : -1));
        } else {
          rows = rows.slice().sort((a, b) => b.score - a.score);
        }

        document.getElementById("leads-tbody").innerHTML = rows.map((l, i) => `
          <tr class="${l.propertyId ? "clickable" : ""}" ${l.propertyId ? `data-id="${l.propertyId}"` : ""} style="${l.propertyId ? "cursor:pointer;" : ""}">
            <td data-label="Rank">${i + 1}</td>
            <td data-label="Score"><span class="score-badge" style="background:${scoreBadgeColor(l.score)}">${l.score}</span></td>
            <td class="lead-prop"><strong>${l.property}</strong> ${l.isNew ? '<span class="pill" style="background:#22c55e22;color:#22c55e;">NEW</span>' : ""}${l.subArea ? `<div class="lead-subarea">${l.subArea}</div>` : ""}
              ${contactHtml(l.contact)}
              <button class="btn deep-dive-btn" data-deep-dive="${l.id}" title="Open the chat with a deep-dive question about this building">✦ Deep dive</button></td>
            <td data-label="City">${l.city}</td>
            <td data-label="Units">${l.units ?? "?"}</td>
            <td data-label="Signal" class="lead-signal">${signalHtml(l)}</td>
            <td data-label="Software">${leadSoftwareHtml(l)}</td>
            <td class="lead-why">${l.why} <span class="lead-src">${l.sources.map((s, n) => /^https?:/.test(s) ? `<a href="${s}" target="_blank" rel="noopener">source${l.sources.length > 1 ? " " + (n + 1) : ""}</a>` : `[${s}]`).join(" · ")}</span></td>
          </tr>
        `).join("");

        document.querySelectorAll("#leads-tbody tr.clickable").forEach((tr) => {
          tr.addEventListener("click", () => {
            location.href = `property.html?id=${encodeURIComponent(tr.dataset.id)}`;
          });
        });

        // The button sits inside a clickable row: stop the click reaching it.
        document.querySelectorAll("#leads-tbody [data-deep-dive]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const l = data.leads.find((x) => x.id === btn.dataset.deepDive);
            window.PSChatPanel.deepDive(window.PSChatPanel.deepDivePrompt({
              name: l.property, city: l.city, units: l.units, software: l.software,
              upcoming: l.signalType === "Upcoming",
            }));
          });
        });
      }

      // The city list only shows cities in the picked region.
      function fillCities() {
        const metro = (document.querySelector(".metro-btn.active") || {}).dataset?.metro || "";
        const sel = document.getElementById("f-city");
        const keep = sel.value;
        const list = [...new Set(data.leads.filter((l) => !metro || l.metro === metro).map((l) => l.city))].sort();
        sel.innerHTML = `<option value="">All cities</option>` + list.map((c) => `<option value="${c}">${c}</option>`).join("");
        if (list.includes(keep)) sel.value = keep;
      }

      function pickMetro(name) {
        document.querySelectorAll(".metro-btn").forEach((b) => b.classList.toggle("active", b.dataset.metro === name));
        fillCities();
        const url = new URL(location.href);
        if (name) url.searchParams.set("region", name); else url.searchParams.delete("region");
        history.replaceState(null, "", url);
        renderRows();
      }

      document.querySelectorAll(".metro-btn").forEach((btn) => {
        btn.addEventListener("click", () => pickMetro(btn.dataset.metro));
      });
      const wantedRegion = new URLSearchParams(location.search).get("region");
      if (wantedRegion && [...document.querySelectorAll(".metro-btn")].some((b) => b.dataset.metro === wantedRegion)) {
        document.querySelectorAll(".metro-btn").forEach((b) => b.classList.toggle("active", b.dataset.metro === wantedRegion));
      }
      fillCities();

      ["f-search", "f-signal", "f-city", "f-software", "f-sort", "f-hide-mine"].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener(el.tagName === "INPUT" && el.type !== "checkbox" ? "input" : "change", renderRows);
      });

      // Deep link: index.html?software=Yardi
      const wanted = new URLSearchParams(location.search).get("software");
      const swSel = document.getElementById("f-software");
      if (wanted && [...swSel.options].some((o) => o.value === wanted)) swSel.value = wanted;

      wireAreaButtons(content, (newSlug) => {
        const newArea = areas.find((a) => a.slug === newSlug);
        history.replaceState(null, "", `?area=${encodeURIComponent(newSlug)}`);  // new state: region resets
        renderPage(areas, newArea);
      });

      renderRows();
    });
    }
  </script>
</body>
</html>
