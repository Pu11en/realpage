<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PropertyStack -- Master Table</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-panel.css" />
  <style>
    .table-scroll { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script src="js/chat-panel.js"></script>
  <script>
    renderShell("table");
    document.getElementById("page-content").innerHTML = `
      <div id="mt-main"></div>
    `;

    loadData("data/properties.json").then((data) => {
      const content = document.getElementById("mt-main");
      const s = data.stats;
      const f = data.funnel;
      const cities = [...new Set(data.properties.map((p) => p.city))].sort();
      const counties = [...new Set(data.properties.map((p) => p.county).filter(Boolean))].sort();
      const softwareOptions = [...new Set(data.properties.map((p) => p.software).filter((v) => v && v !== "unknown"))].sort();
      const years = [...new Set(data.properties.map((p) => p.yearBuilt).filter(Boolean))].sort((a, b) => b - a);

      content.innerHTML = `
        <h1>Master Table</h1>
        <div class="meta">Every apartment in the area. Generated from ${data.generatedFrom}.</div>
        <div class="stats-row">
          <div class="stat-card"><div class="value">${s.apartments}</div><div class="label">Apartments</div></div>
          <div class="stat-card"><div class="value">${s.totalUnits.toLocaleString()}</div><div class="label">Total units</div></div>
          <div class="stat-card"><div class="value">${s.softwareIdentified} (${s.softwareIdentifiedPct}%)</div><div class="label">Software identified</div></div>
          <div class="stat-card"><div class="value">${s.topSoftware || "--"}</div><div class="label">Top software</div></div>
        </div>
        <div class="filters" style="justify-content:space-between;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <input id="f-search" placeholder="Search communities..." />
            <select id="f-city">
              <option value="">All cities</option>
              ${cities.map((c) => `<option value="${c}">${c}</option>`).join("")}
            </select>
            <select id="f-county">
              <option value="">All counties</option>
              ${counties.map((c) => `<option value="${c}">${c}</option>`).join("")}
            </select>
            <select id="f-software">
              <option value="">All software</option>
              <option value="__none__">Unknown</option>
              ${softwareOptions.map((v) => `<option value="${v}">${v}</option>`).join("")}
            </select>
            <select id="f-year">
              <option value="">Any year built</option>
              ${years.map((y) => `<option value="${y}">${y}</option>`).join("")}
            </select>
            <select id="f-size">
              <option value="">Any size</option>
              <option value="0-199">Under 200 units</option>
              <option value="200-399">200-399 units</option>
              <option value="400-599">400-599 units</option>
              <option value="600-99999">600+ units</option>
            </select>
          </div>
          <button class="btn" id="export-csv">Export CSV</button>
        </div>
        <div class="table-scroll"><table>
          <thead>
            <tr id="table-head-row"><th data-sort="0">Community</th><th data-sort="1">City</th><th data-sort="2">County</th><th data-sort="3">Units</th><th data-sort="4">Year built</th><th data-sort="5">Owner</th><th data-sort="6">Software</th><th>Proof</th></tr>
          </thead>
          <tbody id="table-tbody"></tbody>
        </table></div>
        <div style="color:var(--text-dim);font-size:13px;margin-top:8px;">
          ${f.inArea} apartments &rarr; ${f.websiteFound ?? "--"} with a website &rarr; ${f.identified} identified &rarr; ${f.unknown} unknown
        </div>
        <div style="color:var(--text-dim);font-size:12px;margin-top:4px;" id="row-count"></div>
      `;

      let sortKey = null; let sortDir = 1;
      const SORT_GETTERS = {
        0: (p) => (p.community || "").toLowerCase(),
        1: (p) => (p.city || "").toLowerCase(),
        2: (p) => (p.county || "").toLowerCase(),
        3: (p) => p.units ?? -1,
        4: (p) => p.yearBuilt ?? -1,
        5: (p) => (p.owner || "").toLowerCase(),
        6: (p) => (p.software || "").toLowerCase(),
      };

      function currentRows() {
        const search = document.getElementById("f-search").value.trim().toLowerCase();
        const city = document.getElementById("f-city").value;
        const county = document.getElementById("f-county").value;
        const software = document.getElementById("f-software").value;
        const year = document.getElementById("f-year").value;
        const size = document.getElementById("f-size").value;

        const rows = data.properties.filter((p) => {
          if (search && !p.community.toLowerCase().includes(search)) return false;
          if (city && p.city !== city) return false;
          if (county && p.county !== county) return false;
          if (software === "__none__" && p.software && p.software !== "unknown") return false;
          if (software && software !== "__none__" && p.software !== software) return false;
          if (year && String(p.yearBuilt) !== year) return false;
          if (size) {
            const [lo, hi] = size.split("-").map(Number);
            const units = p.units || 0;
            if (units < lo || units > hi) return false;
          }
          return true;
        });
        if (sortKey !== null) {
          const get = SORT_GETTERS[sortKey];
          rows.sort((a, b) => {
            const va = get(a), vb = get(b);
            if (va < vb) return -sortDir;
            if (va > vb) return sortDir;
            return 0;
          });
        }
        return rows;
      }

      function renderRows() {
        const rows = currentRows();

        document.getElementById("table-tbody").innerHTML = rows.map((p) => `
          <tr class="clickable ${isDimmedRow(p.software) ? "dimmed" : ""}" data-id="${p.id}" style="cursor:pointer;">
            <td>${p.community}</td>
            <td>${p.city}</td>
            <td>${p.county ?? "--"}</td>
            <td>${p.units ?? "--"}</td>
            <td>${p.yearBuilt ?? "--"}</td>
            <td>${p.owner}</td>
            <td>${vendorPill(p.software === "unknown" ? null : p.software, data.vendorColors)}</td>
            <td>${p.proof ? `<a href="${p.proof}" style="color:var(--accent);" onclick="event.stopPropagation();" target="_blank" rel="noopener">link</a>` : "--"}</td>
          </tr>
        `).join("");

        document.querySelectorAll("#table-tbody tr.clickable").forEach((tr) => {
          tr.addEventListener("click", () => {
            location.href = `property.html?id=${encodeURIComponent(tr.dataset.id)}`;
          });
        });

        document.getElementById("row-count").textContent = `Showing ${rows.length} of ${data.properties.length} rows.`;
      }

      function updateHeadArrows() {
        document.querySelectorAll("#table-head-row th[data-sort]").forEach((th) => {
          const idx = Number(th.dataset.sort);
          const arrow = sortKey === idx ? (sortDir === 1 ? " ▲" : " ▼") : "";
          th.textContent = th.textContent.replace(/ [▲▼]$/, "") + arrow;
          th.style.cursor = "pointer";
        });
      }

      document.querySelectorAll("#table-head-row th[data-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          const idx = Number(th.dataset.sort);
          if (sortKey === idx) { sortDir = -sortDir; } else { sortKey = idx; sortDir = 1; }
          updateHeadArrows();
          renderRows();
        });
      });
      updateHeadArrows();

      function csvEscape(value) {
        const str = String(value ?? "");
        return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
      }

      function exportCsv() {
        const rows = currentRows();
        const header = ["Community", "City", "County", "Units", "Year built", "Owner", "Software", "Proof"];
        const lines = [header.join(",")];
        rows.forEach((p) => {
          lines.push([
            p.community,
            p.city,
            p.county ?? "",
            p.units ?? "",
            p.yearBuilt ?? "",
            p.owner,
            p.software === "unknown" ? "" : (p.software || ""),
            p.proof || "",
          ].map(csvEscape).join(","));
        });
        const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "propertystack-master-table.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      ["f-search", "f-city", "f-county", "f-software", "f-year", "f-size"].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener(el.tagName === "INPUT" ? "input" : "change", renderRows);
      });
      document.getElementById("export-csv").addEventListener("click", exportCsv);

      // Deep link from Software Share: master-table.html?software=Yardi
      const softwareParam = new URLSearchParams(location.search).get("software");
      const softwareSelect = document.getElementById("f-software");
      if (softwareParam && [...softwareSelect.options].some((o) => o.value === softwareParam)) {
        softwareSelect.value = softwareParam;
      }

      renderRows();
    });
  </script>
</body>
</html>
