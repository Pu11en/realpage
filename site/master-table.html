<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PropertyStack -- Master Table</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    /* Page 2 only: table left ~2/3, chat right ~1/3. */
    .mt-layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
    .mt-layout.chat-collapsed { grid-template-columns: minmax(0, 1fr) auto; }
    .table-scroll { overflow-x: auto; }
    .chat-panel {
      position: sticky; top: 24px; height: calc(100vh - 48px);
      display: flex; flex-direction: column;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; min-height: 0;
    }
    .chat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .chat-title { font-weight: 700; }
    .chat-sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .chat-toggle { padding: 2px 10px; font-size: 16px; line-height: 1.4; }
    .chat-new { margin-left: auto; padding: 2px 10px; font-size: 12px; line-height: 1.8; white-space: nowrap; flex-shrink: 0; }
    .chat-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .chat-collapsed .chat-panel { height: auto; }
    .chat-collapsed .chat-body, .chat-collapsed .chat-sub, .chat-collapsed .chat-new { display: none; }
    .chat-collapsed .chat-title { writing-mode: vertical-rl; }
    .chat-collapsed .chat-head { flex-direction: column-reverse; border-bottom: none; }
    .chat-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .chat-empty { display: flex; flex-direction: column; gap: 8px; color: var(--text-muted); font-size: 13px; }
    .chat-example { text-align: left; color: var(--text); }
    .msg { max-width: 100%; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; max-width: 90%; white-space: pre-wrap; }
    .msg.bot { border-left: 2px solid var(--border); padding-left: 10px; }
    .msg.bot p { margin: 0 0 8px; }
    .msg.bot p:last-child { margin-bottom: 0; }
    .msg.bot ul, .msg.bot ol { margin: 0 0 8px; padding-left: 18px; }
    .msg.bot a { color: var(--accent); }
    .msg.bot code { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
    .msg.bot pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow-x: auto; }
    .msg.bot .md-table { overflow-x: auto; margin: 0 0 8px; }
    .msg.bot table { font-size: 12px; }
    .msg.bot th, .msg.bot td { padding: 5px 6px; font-size: 12px; overflow-wrap: normal; }
    .msg.bot th { white-space: nowrap; }
    .msg.bot td a { word-break: break-all; }
    .msg.bot tr:last-child td { border-bottom: 1px solid var(--border); }
    .cite { display: inline-block; font-family: var(--mono); font-size: 11px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin: 0 1px; white-space: nowrap; }
    .msg-meta { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
    .msg.error { color: var(--score-low); border-left: 2px solid var(--score-low); padding-left: 10px; }
    .msg.error .btn { margin-top: 6px; }
    .typing { color: var(--text-muted); font-size: 13px; }
    .typing span { display: inline-block; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    .chat-close { display: none; padding: 2px 10px; font-size: 16px; line-height: 1.4; }
    .chat-fab {
      display: none; position: fixed; right: 16px; bottom: 16px; z-index: 40;
      background: var(--accent); color: #0a0a0b; border: none; border-radius: 999px;
      padding: 12px 20px; font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
    .chat-form textarea {
      flex: 1; resize: none; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 8px 10px; font-family: var(--font); font-size: 13px;
    }
    .chat-form textarea:focus { outline: none; border-color: var(--accent); }
    .chat-form .btn:disabled { opacity: 0.5; cursor: default; }
    @media (max-width: 900px) {
      .mt-layout, .mt-layout.chat-collapsed { grid-template-columns: minmax(0, 1fr); }
      /* Phones: chat hidden behind a floating Ask button, opens full-screen. */
      .chat-panel { display: none; }
      body.chat-open .chat-panel { display: flex; position: fixed; inset: 0; height: auto; border-radius: 0; border: none; z-index: 50; }
      body.chat-open { overflow: hidden; }
      .chat-toggle { display: none; }
      .chat-close { display: inline-block; }
      .chat-fab { display: block; }
      body.chat-open .chat-fab { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script>
    renderShell("table");
    document.getElementById("page-content").innerHTML = `
      <div class="mt-layout" id="mt-layout">
        <div class="mt-main" id="mt-main"></div>
        <aside class="chat-panel" id="chat-panel" aria-label="Ask the data">
          <div class="chat-head">
            <div>
              <div class="chat-title">Ask PropertyStack</div>
              <div class="chat-sub">Answers cite the data they come from.</div>
            </div>
            <button class="btn chat-new" id="chat-new" title="Clear this conversation">New chat</button>
            <button class="btn chat-toggle" id="chat-toggle" aria-expanded="true" title="Collapse chat">&minus;</button>
            <button class="btn chat-close" id="chat-close" aria-label="Close chat">&times;</button>
          </div>
          <div class="chat-body" id="chat-body">
            <div class="chat-log" id="chat-log" aria-live="polite">
              <div class="chat-empty" id="chat-empty">
                <div>Try one of these:</div>
                <button class="btn chat-example">Which software vendor runs the most buildings?</button>
                <button class="btn chat-example">List the 5 largest apartments in Plano with their software.</button>
                <button class="btn chat-example">What do renters complain about most on Reddit?</button>
              </div>
            </div>
            <form class="chat-form" id="chat-form">
              <textarea id="chat-input" rows="2" maxlength="1000" placeholder="Ask about the buildings, software or research... (Enter to send)"></textarea>
              <button class="btn" type="submit" id="chat-send">Send</button>
            </form>
          </div>
        </aside>
      </div>
      <button class="chat-fab" id="chat-fab" aria-label="Open chat">Ask</button>
    `;

    loadData("data/properties.json").then((data) => {
      const content = document.getElementById("mt-main");
      const s = data.stats;
      const f = data.funnel;
      const cities = [...new Set(data.properties.map((p) => p.city))].sort();
      const counties = [...new Set(data.properties.map((p) => p.county).filter(Boolean))].sort();
      const softwareOptions = [...new Set(data.properties.map((p) => p.software).filter((v) => v && v !== "unknown"))].sort();
      const years = [...new Set(data.properties.map((p) => p.yearBuilt).filter(Boolean))].sort((a, b) => b - a);

      content.innerHTML = `
        <h1>Master Table</h1>
        <div class="meta">Every apartment in the area. Generated from ${data.generatedFrom}.</div>
        <div class="stats-row">
          <div class="stat-card"><div class="value">${s.apartments}</div><div class="label">Apartments</div></div>
          <div class="stat-card"><div class="value">${s.totalUnits.toLocaleString()}</div><div class="label">Total units</div></div>
          <div class="stat-card"><div class="value">${s.softwareIdentified} (${s.softwareIdentifiedPct}%)</div><div class="label">Software identified</div></div>
          <div class="stat-card"><div class="value">${s.topSoftware || "--"}</div><div class="label">Top software</div></div>
        </div>
        <div class="filters" style="justify-content:space-between;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <input id="f-search" placeholder="Search communities..." />
            <select id="f-city">
              <option value="">All cities</option>
              ${cities.map((c) => `<option value="${c}">${c}</option>`).join("")}
            </select>
            <select id="f-county">
              <option value="">All counties</option>
              ${counties.map((c) => `<option value="${c}">${c}</option>`).join("")}
            </select>
            <select id="f-software">
              <option value="">All software</option>
              <option value="__none__">Unknown</option>
              ${softwareOptions.map((v) => `<option value="${v}">${v}</option>`).join("")}
            </select>
            <select id="f-year">
              <option value="">Any year built</option>
              ${years.map((y) => `<option value="${y}">${y}</option>`).join("")}
            </select>
            <select id="f-size">
              <option value="">Any size</option>
              <option value="0-199">Under 200 units</option>
              <option value="200-399">200-399 units</option>
              <option value="400-599">400-599 units</option>
              <option value="600-99999">600+ units</option>
            </select>
          </div>
          <button class="btn" id="export-csv">Export CSV</button>
        </div>
        <div class="table-scroll"><table>
          <thead>
            <tr id="table-head-row"><th data-sort="0">Community</th><th data-sort="1">City</th><th data-sort="2">County</th><th data-sort="3">Units</th><th data-sort="4">Year built</th><th data-sort="5">Owner</th><th data-sort="6">Software</th><th>Proof</th></tr>
          </thead>
          <tbody id="table-tbody"></tbody>
        </table></div>
        <div style="color:var(--text-dim);font-size:13px;margin-top:8px;">
          ${f.inArea} apartments &rarr; ${f.websiteFound ?? "--"} with a website &rarr; ${f.identified} identified &rarr; ${f.unknown} unknown
        </div>
        <div style="color:var(--text-dim);font-size:12px;margin-top:4px;" id="row-count"></div>
      `;

      let sortKey = null; let sortDir = 1;
      const SORT_GETTERS = {
        0: (p) => (p.community || "").toLowerCase(),
        1: (p) => (p.city || "").toLowerCase(),
        2: (p) => (p.county || "").toLowerCase(),
        3: (p) => p.units ?? -1,
        4: (p) => p.yearBuilt ?? -1,
        5: (p) => (p.owner || "").toLowerCase(),
        6: (p) => (p.software || "").toLowerCase(),
      };

      function currentRows() {
        const search = document.getElementById("f-search").value.trim().toLowerCase();
        const city = document.getElementById("f-city").value;
        const county = document.getElementById("f-county").value;
        const software = document.getElementById("f-software").value;
        const year = document.getElementById("f-year").value;
        const size = document.getElementById("f-size").value;

        const rows = data.properties.filter((p) => {
          if (search && !p.community.toLowerCase().includes(search)) return false;
          if (city && p.city !== city) return false;
          if (county && p.county !== county) return false;
          if (software === "__none__" && p.software && p.software !== "unknown") return false;
          if (software && software !== "__none__" && p.software !== software) return false;
          if (year && String(p.yearBuilt) !== year) return false;
          if (size) {
            const [lo, hi] = size.split("-").map(Number);
            const units = p.units || 0;
            if (units < lo || units > hi) return false;
          }
          return true;
        });
        if (sortKey !== null) {
          const get = SORT_GETTERS[sortKey];
          rows.sort((a, b) => {
            const va = get(a), vb = get(b);
            if (va < vb) return -sortDir;
            if (va > vb) return sortDir;
            return 0;
          });
        }
        return rows;
      }

      function renderRows() {
        const rows = currentRows();

        document.getElementById("table-tbody").innerHTML = rows.map((p) => `
          <tr class="clickable ${isDimmedRow(p.software) ? "dimmed" : ""}" data-id="${p.id}" style="cursor:pointer;">
            <td>${p.community}</td>
            <td>${p.city}</td>
            <td>${p.county ?? "--"}</td>
            <td>${p.units ?? "--"}</td>
            <td>${p.yearBuilt ?? "--"}</td>
            <td>${p.owner}</td>
            <td>${vendorPill(p.software === "unknown" ? null : p.software, data.vendorColors)}</td>
            <td>${p.proof ? `<a href="${p.proof}" style="color:var(--accent);" onclick="event.stopPropagation();" target="_blank" rel="noopener">link</a>` : "--"}</td>
          </tr>
        `).join("");

        document.querySelectorAll("#table-tbody tr.clickable").forEach((tr) => {
          tr.addEventListener("click", () => {
            location.href = `property.html?id=${encodeURIComponent(tr.dataset.id)}`;
          });
        });

        document.getElementById("row-count").textContent = `Showing ${rows.length} of ${data.properties.length} rows.`;
      }

      function updateHeadArrows() {
        document.querySelectorAll("#table-head-row th[data-sort]").forEach((th) => {
          const idx = Number(th.dataset.sort);
          const arrow = sortKey === idx ? (sortDir === 1 ? " ▲" : " ▼") : "";
          th.textContent = th.textContent.replace(/ [▲▼]$/, "") + arrow;
          th.style.cursor = "pointer";
        });
      }

      document.querySelectorAll("#table-head-row th[data-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          const idx = Number(th.dataset.sort);
          if (sortKey === idx) { sortDir = -sortDir; } else { sortKey = idx; sortDir = 1; }
          updateHeadArrows();
          renderRows();
        });
      });
      updateHeadArrows();

      function csvEscape(value) {
        const str = String(value ?? "");
        return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
      }

      function exportCsv() {
        const rows = currentRows();
        const header = ["Community", "City", "County", "Units", "Year built", "Owner", "Software", "Proof"];
        const lines = [header.join(",")];
        rows.forEach((p) => {
          lines.push([
            p.community,
            p.city,
            p.county ?? "",
            p.units ?? "",
            p.yearBuilt ?? "",
            p.owner,
            p.software === "unknown" ? "" : (p.software || ""),
            p.proof || "",
          ].map(csvEscape).join(","));
        });
        const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "propertystack-master-table.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      ["f-search", "f-city", "f-county", "f-software", "f-year", "f-size"].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener(el.tagName === "INPUT" ? "input" : "change", renderRows);
      });
      document.getElementById("export-csv").addEventListener("click", exportCsv);

      // Deep link from Software Share: master-table.html?software=Yardi
      const softwareParam = new URLSearchParams(location.search).get("software");
      const softwareSelect = document.getElementById("f-software");
      if (softwareParam && [...softwareSelect.options].some((o) => o.value === softwareParam)) {
        softwareSelect.value = softwareParam;
      }

      renderRows();
    });
  </script>
  <script>
    // Chat panel -- talks to the Hermes chatbot service (Task 8).
    (function () {
      // On localhost, talk to the local Docker bot (chatbot/README.md) unless ?bot=live.
      const LOCAL = location.hostname === "localhost" && !/[?&]bot=live\b/.test(location.search);
      const CHAT_URL = LOCAL ? "http://localhost:18080/chat" : "https://propertystack-chatbot-production.up.railway.app/chat";
      const layout = document.getElementById("mt-layout");
      const log = document.getElementById("chat-log");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const send = document.getElementById("chat-send");
      const toggle = document.getElementById("chat-toggle");
      let busy = false;
      // Bumped by "New chat" so an answer still in flight is dropped.
      let generation = 0;
      const emptyHtml = document.getElementById("chat-empty").outerHTML;
      // Conversation memory: kept in localStorage so it survives reloads and
      // navigating away and back (same browser only).
      const history = [];
      const CHAT_STORE = "ps-chat-v1";
      // The server keeps the conversation under this random id; "New chat" makes a new one.
      const SESSION_STORE = "ps-chat-session";
      function newSessionId() {
        return crypto.randomUUID ? crypto.randomUUID() : [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      let sessionId = null;
      try { sessionId = localStorage.getItem(SESSION_STORE); } catch (_) {}
      if (!sessionId) {
        sessionId = newSessionId();
        try { localStorage.setItem(SESSION_STORE, sessionId); } catch (_) {}
      }
      function saveChat() {
        try {
          // Skip "Thinking..." and error bubbles: restored, they'd be stuck or have a dead Retry.
          const items = [...log.querySelectorAll(".msg:not(.typing):not(.error)")].map((el) => ({ cls: el.className, html: el.innerHTML }));
          localStorage.setItem(CHAT_STORE, JSON.stringify({ history: history.slice(-20), items: items.slice(-40) }));
        } catch (_) { /* private mode / quota: chat just won't persist */ }
      }
      function restoreChat() {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(CHAT_STORE) || "null"); } catch (_) { return; }
        if (!saved || !Array.isArray(saved.items) || !saved.items.length) return;
        const empty = document.getElementById("chat-empty");
        if (empty) empty.remove();
        for (const it of saved.items) {
          const el = document.createElement("div");
          el.className = it.cls;
          el.innerHTML = it.html;
          log.appendChild(el);
        }
        history.push(...(saved.history || []));
        log.scrollTop = log.scrollHeight;
      }

      DOMPurify.addHook("afterSanitizeAttributes", (node) => {
        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        }
      });

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      // The model sometimes sends pipe tables without the |---| row; add it so
      // marked renders a real table.
      function repairTables(text) {
        const lines = text.split("\n");
        const cols = (l) => (/\S\s*\|\s*\S/.test(l) ? l.replace(/^\s*\||\|\s*$/g, "").split("|").length : 0);
        const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
        const out = [];
        for (let i = 0; i < lines.length; i++) {
          out.push(lines[i]);
          const n = cols(lines[i]);
          const startsBlock = i === 0 || !cols(lines[i - 1]);
          if (n >= 2 && startsBlock && i + 1 < lines.length && cols(lines[i + 1]) === n && !isSep(lines[i + 1])) {
            out.push(Array(n).fill("---").join(" | "));
          }
        }
        return out.join("\n");
      }

      function renderMarkdown(text) {
        // [5-sales.csv] / [04-reddit/index.md; 1-buildings.csv] -> citation chips.
        // Skips real markdown links [text](url).
        const withCites = repairTables(text).replace(/\[([^\[\]\n]+)\](?!\()/g, (m, inner) => {
          const parts = inner.split(/[,;]/).map((p) => p.trim()).filter(Boolean);
          if (!parts.length || !parts.every((p) => /[./]/.test(p) && !/\s/.test(p))) return m;
          return parts.map((p) => `<span class="cite">${escapeHtml(p)}</span>`).join("");
        });
        const html = DOMPurify.sanitize(marked.parse(withCites, { gfm: true, breaks: true }));
        const wrap = document.createElement("div");
        wrap.innerHTML = html;
        wrap.querySelectorAll("table").forEach((t) => {
          const box = document.createElement("div");
          box.className = "md-table";
          t.replaceWith(box);
          box.appendChild(t);
        });
        return wrap.innerHTML;
      }

      function scrollToBottom() {
        log.scrollTop = log.scrollHeight;
      }

      function addMessage(cls, html) {
        const empty = document.getElementById("chat-empty");
        if (empty) empty.remove();
        const el = document.createElement("div");
        el.className = `msg ${cls}`;
        el.innerHTML = html;
        log.appendChild(el);
        scrollToBottom();
        saveChat();
        return el;
      }

      function setBusy(value) {
        busy = value;
        send.disabled = value;
      }

      async function ask(question) {
        if (busy) return;
        setBusy(true);
        const gen = generation;
        const typing = addMessage("typing", "Thinking<span>.</span><span>.</span><span>.</span> <span style=\"animation:none;opacity:1;color:var(--text-dim);font-size:11px;\">(can take up to a minute)</span>");
        try {
          const res = await fetch(CHAT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // history is ignored by servers that know session_id; kept for the live bot until it's redeployed.
            body: JSON.stringify({ message: question, session_id: sessionId, history: history.slice(-10) }),
          });
          let body = {};
          try { body = await res.json(); } catch (_) { /* non-JSON error page */ }
          if (gen !== generation) return;
          if (!res.ok || typeof body.answer !== "string") {
            throw new Error(body.error || `server returned ${res.status}`);
          }
          typing.remove();
          history.push({ role: "user", content: question }, { role: "assistant", content: body.answer });
          const meta = body.seconds != null ? `<div class="msg-meta">${body.seconds}s</div>` : "";
          addMessage("bot", renderMarkdown(body.answer || "I don't have that.") + meta);
        } catch (err) {
          if (gen !== generation) return;
          typing.remove();
          const msg = err instanceof TypeError ? "Couldn't reach the chatbot." : `Something went wrong: ${err.message}.`;
          const el = addMessage("error", `<div>${escapeHtml(msg)}</div><button class="btn">Retry</button>`);
          el.querySelector("button").addEventListener("click", () => {
            el.remove();
            ask(question);
          });
        } finally {
          if (gen === generation) setBusy(false);
        }
      }

      function submit(text) {
        const question = (text ?? input.value).trim();
        if (!question || busy) return;
        input.value = "";
        addMessage("user", escapeHtml(question));
        ask(question);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        submit();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          submit();
        }
      });
      function bindExamples() {
        document.querySelectorAll(".chat-example").forEach((b) => {
          b.addEventListener("click", () => submit(b.textContent));
        });
      }
      restoreChat();
      bindExamples();
      document.getElementById("chat-new").addEventListener("click", () => {
        generation++;
        history.length = 0;
        sessionId = newSessionId();
        try { localStorage.removeItem(CHAT_STORE); localStorage.setItem(SESSION_STORE, sessionId); } catch (_) {}
        log.innerHTML = emptyHtml;
        bindExamples();
        setBusy(false);
        input.value = "";
        input.focus();
      });
      document.getElementById("chat-fab").addEventListener("click", () => {
        document.body.classList.add("chat-open");
        scrollToBottom();
        input.focus();
      });
      document.getElementById("chat-close").addEventListener("click", () => {
        document.body.classList.remove("chat-open");
      });
      toggle.addEventListener("click", () => {
        const collapsed = layout.classList.toggle("chat-collapsed");
        toggle.setAttribute("aria-expanded", String(!collapsed));
        toggle.innerHTML = collapsed ? "+" : "&minus;";
        toggle.title = collapsed ? "Open chat" : "Collapse chat";
        if (!collapsed) scrollToBottom();
      });
    })();
  </script>
</body>
</html>
