<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>CraneSignal -- AI Visibility</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-panel.css" />
  <style>
    h2 { font-size: 16px; margin: 28px 0 10px; }
    .verdict { font-size: 22px; font-weight: 700; margin: 6px 0 14px; line-height: 1.3; }
    .stat-card .sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
    .when { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin: 18px 0 8px; }
    .action { margin-bottom: 10px; }
    .action h3 { font-size: 15px; margin: 0 0 8px; }
    .action .row { font-size: 13px; margin: 4px 0; color: var(--text); display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
    .action .row b { color: var(--text-muted); font-weight: 600; }
    .facts li { margin: 4px 0; font-size: 13px; list-style: none; }
    .facts { padding-left: 0; }
    .bar-row { display: grid; grid-template-columns: 120px 1fr 60px; align-items: center; gap: 10px; margin: 4px 0; font-size: 13px; }
    .bar-row .track { height: 12px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
    .bar-row .fill { height: 100%; background: #9aa1b0; }
    .bar-row.us .fill { background: var(--accent); }
    .missed li { font-size: 13px; margin: 4px 0; }
    .ai-answer summary { cursor: pointer; }
    .ai-answer { color: var(--text-muted); font-size: 12px; max-width: 520px; }
    .muted { color: var(--text-muted); }
    details.evidence > summary { cursor: pointer; font-size: 16px; font-weight: 600; margin: 28px 0 10px; }
    .last-run { font-size: 13px; color: var(--text-muted); margin: 4px 0 10px; }
    .trends { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .trend svg { width: 100%; height: auto; display: block; }
    .trend svg text { fill: var(--text-muted); font-size: 10px; }
    .legend { font-size: 12px; color: var(--text-muted); margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .legend i { background: var(--c); }
    .legend i.base { background: none; border: 2px solid var(--c); width: 6px; height: 6px; }
    .trend .grid { stroke: var(--rule); }
    .trend .ln { fill: none; stroke: var(--c); stroke-width: 2; }
    .trend .pt { fill: var(--c); } .trend .pt.base { fill: var(--paper); stroke: var(--c); stroke-width: 2; }
    /* Series colours: blue / amber / grey families that read on white (dataviz). */
    .s0 { --c: #1a3d8f; } .s1 { --c: #6f8fd6; } .s2 { --c: #c98a00; } .s3 { --c: #e8b64a; } .s4 { --c: #5d6577; }
    .s5 { --c: #2f5bbf; } .s6 { --c: #8f4a07; } .s7 { --c: #a3a9b6; }
    .note { font-size: 13px; } .note-sm { font-size: 12px; }
    .note-gap { font-size: 13px; margin-bottom: 6px; } .note-gap-lg { font-size: 13px; margin-bottom: 10px; }
    .note-gap-md { font-size: 13px; margin-bottom: 8px; }
    .src-row.us { color: var(--accent); font-weight: 600; }
    .up { color: var(--score-low); } .down { color: var(--accent); }
    .tone-bar { display: flex; height: 16px; border-radius: 3px; overflow: hidden; margin: 6px 0 4px; background: var(--paper-2); border: 1px solid var(--rule); }
    .tone-bar span { display: block; height: 100%; }
    .tone-harsh { background: var(--score-low); } .tone-neutral { background: #9aa1b0; } .tone-settled { background: var(--amber); }
    .tone-word-harsh { color: var(--score-low); } .tone-word-settled { color: var(--score-mid); }
    .tone-row { font-size: 13px; margin: 10px 0; }
    .quote { border-left: 3px solid var(--blue-soft); padding: 4px 0 4px 10px; margin: 12px 0; font-size: 13px; }
    .quote blockquote { margin: 0 0 4px; color: var(--text); }
    .quote .muted { font-size: 12px; }
    .quote a { color: var(--accent); margin-right: 8px; }
    .bar-row.zero .fill { background: transparent; }
    .lawsuit-quotes { margin-top: 14px; }
    .lawsuit-quotes details { margin-top: 8px; }
    .lawsuit-quotes summary { cursor: pointer; }
  </style>
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script src="js/chat-panel.js"></script>
  <script>
    renderShell("ai");

    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const pct = (v) => (v === null || v === undefined ? "--" : `${Math.round(v)}%`);
    const rank = (v) => (v === null || v === undefined ? "--" : `#${Math.round(v * 10) / 10}`);


    // Run history (T3/T4): index.json + one file per run. Missing history must not break the rest of the page.
    const HIST = "data/ai-visibility-history/";
    const loadHistory = () => loadData(HIST + "index.json")
      .then((ix) => Promise.all(ix.runs.map((r) => loadData(HIST + r.file))))
      .then((runs) => runs.sort((a, b) => a.date.localeCompare(b.date)))
      .catch(() => []);
    const SERIES = ["gemini", "gemini-web", "claude", "claude-web", "chatgpt"];
    const color = (m, i) => SERIES.includes(m) ? `s${SERIES.indexOf(m)}` : `s${5 + (i % 3)}`;
    const niceDate = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });

    // One small SVG line chart: a line per AI across its own runs, baseline AIs as labelled hollow points.
    function trendChart(title, key, runs) {
      const W = 320, H = 170, L = 30, R = 10, T = 12, B = 26;
      const dates = runs.map((r) => r.date);
      const x = (d) => dates.length < 2 ? (L + W - R) / 2 : L + (dates.indexOf(d) / (dates.length - 1)) * (W - L - R);
      const y = (v) => T + (1 - v / 100) * (H - T - B);
      const series = {};
      runs.forEach((r) => r.models.forEach((m) => {
        if (m[key] === null || m[key] === undefined) return;
        (series[m.model] ||= { name: m.name, baseline: r.baseline, pts: [] }).pts.push([r.date, m[key]]);
      }));
      const grid = [0, 50, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${v}%</text>`).join("");
      const anchor = (i) => dates.length < 2 ? "middle" : i === 0 ? "start" : i === dates.length - 1 ? "end" : "middle";
      const ticks = dates.map((d, i) => `<text x="${x(d) + (anchor(i) === "start" ? -4 : anchor(i) === "end" ? 4 : 0)}" y="${H - 8}" text-anchor="${anchor(i)}">${esc(niceDate(d))}</text>`).join("");
      const marks = Object.entries(series).map(([model, s], i) => {
        const c = color(model, i);
        if (s.baseline) return s.pts.map(([d, v]) => `<circle class="pt base ${c}" cx="${x(d)}" cy="${y(v)}" r="4"><title>${esc(s.name)} (baseline): ${pct(v)}</title></circle>`).join("");
        const line = s.pts.length > 1 ? `<polyline class="ln ${c}" points="${s.pts.map(([d, v]) => `${x(d)},${y(v)}`).join(" ")}"/>` : "";
        return line + s.pts.map(([d, v]) => `<circle class="pt ${c}" cx="${x(d)}" cy="${y(v)}" r="3.5"><title>${esc(s.name)}: ${pct(v)}</title></circle>`).join("");
      }).join("");
      const legend = Object.entries(series).map(([model, s], i) => {
        const last = s.pts[s.pts.length - 1][1];
        return `<span><i class="${color(model, i)}${s.baseline ? " base" : ""}"></i>${esc(s.name)}${s.baseline ? " (Sept 12 baseline)" : ""}: ${pct(last)}</span>`;
      }).join("");
      return `<div class="card trend" data-trend="${key}"><div class="muted note-gap">${esc(title)}</div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} over time">${grid}${ticks}${marks}</svg>
        <div class="legend">${legend}</div></div>`;
    }

    // Latest run of every AI (Sept 12 Claude/ChatGPT baseline + each Gemini run): the page sums across all of them.
    function latestPerAI(runs) {
      const seen = {};
      runs.slice().reverse().forEach((r) => r.models.forEach((m) => { if (!seen[m.model]) seen[m.model] = { ...m, date: r.date, baseline: r.baseline }; }));
      return Object.values(seen);
    }
    const wavg = (ms, key) => { const xs = ms.filter((m) => m[key] !== null && m[key] !== undefined); const n = xs.reduce((a, m) => a + (m.answers || 1), 0); return n ? xs.reduce((a, m) => a + m[key] * (m.answers || 1), 0) / n : null; };

    function aiTable(ais, t) {
      return `<table id="each-ai"><thead><tr><th>AI</th><th>Tested</th><th>Named ${t}</th><th>Top pick (no brand asked)</th><th>Brought up lawsuit</th></tr></thead>
        <tbody>${ais.map((m) => `<tr><td>${esc(m.name)}</td><td class="muted">${esc(niceDate(m.date))}</td><td>${pct(m.mentionPct)}</td><td>${pct(m.topPickPct)}</td><td>${pct(m.lawsuitPct)}</td></tr>`).join("")}</tbody></table>`;
    }

    function trendSection(runs, t) {
      const own = runs.filter((r) => !r.baseline);
      const counts = {};
      own.forEach((r) => r.models.forEach((m) => { counts[m.model] = (counts[m.model] || 0) + 1; }));
      if (!Object.values(counts).some((n) => n > 1)) return "";  // one run per AI: nothing to trend yet
      return `<h2>Trend over time</h2><div class="trends">
        ${trendChart(`Named ${t} (all questions)`, "mentionPct", runs)}
        ${trendChart(`Made ${t} the top pick (no brand asked)`, "topPickPct", runs)}
        ${trendChart(`Brought up the lawsuit (asked about ${t})`, "lawsuitPct", runs)}</div>`;
    }

    function lawsuitSection(runs, ais) {
      const mentions = runs.slice().reverse().filter((r) => r.lawsuit).flatMap((r) => r.lawsuit.mentions.map((m) => ({ ...m, date: r.date })));
      if (!mentions.length) return "";
      const who = ais.map((m) => `<div class="bar-row ${m.lawsuitPct ? "" : "zero"}"><div>${esc(m.name)}</div><div class="track"><div class="fill" style="width:${m.lawsuitPct || 0}%"></div></div><div>${pct(m.lawsuitPct)}</div></div>`).join("");
      const quote = (m) => `<div class="quote"><blockquote>${m.sentences.map(esc).join(" ")}</blockquote>
        <div class="muted">${esc(m.name)} · ${esc(niceDate(m.date))} · asked: “${esc(m.question)}”</div>
        ${(m.sources || []).length ? `<div>${m.sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.site)}</a>`).join("")}</div>` : ""}</div>`;
      const shown = mentions.slice(0, 3), rest = mentions.slice(3);
      return `<h2>The lawsuit in AI answers</h2>
        <div class="card" id="lawsuit"><div class="muted note-gap-lg">Share of answers about RealPage by name that bring up the antitrust case</div>${who}
        <div class="lawsuit-quotes" id="lawsuit-quotes">${shown.map(quote).join("")}
        ${rest.length ? `<details><summary class="muted note">${rest.length} more quotes</summary>${rest.map(quote).join("")}</details>` : ""}</div></div>`;
    }

    Promise.all([loadData("data/ai-visibility.json"), loadData("data/ai-visibility-actions.json"), loadHistory()]).then(([d, plan, runs]) => {
      const content = document.getElementById("page-content");
      const f = d.founder, t = esc(d.target);
      const leader = f.topPicks[0] || { name: "--", count: 0 };
      const maxPick = Math.max(1, ...f.topPicks.map((p) => p.count));

      const actionCard = (a) => `
        <div class="card action">
          <h3>${esc(a.title)}</h3>
          <div class="row"><b>Why</b><span>${esc(a.why)}</span></div>
          <div class="row"><b>Do</b><span>${esc(a.do)}</span></div>
          <div class="row"><b>Fixes</b><span>${esc(a.fixes)}</span></div>
          <div class="row"><b>Effort</b><span>${esc(a.effort)}</span></div>
        </div>`;

      const ais = latestPerAI(runs);
      const stat = ais.length ? { named: wavg(ais, "unbrandedMentionPct"), top: wavg(ais, "topPickPct"), law: wavg(ais, "lawsuitPct") } : { named: f.unbrandedNamedPct, top: f.unbrandedTopPickPct, law: f.lawsuitPct };
      const answers = ais.reduce((a, m) => a + (m.answers || 0), 0) || d.overall.answers;
      const dates = [...new Set(ais.map((m) => niceDate(m.date)))];
      const picks = {}; ais.forEach((m) => (m.topPicks || []).forEach((p) => { picks[p.name] = (picks[p.name] || 0) + p.count; }));
      const topPicks = Object.entries(picks).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
      const maxPick2 = Math.max(1, ...topPicks.map((p) => p.count));
      const missed = {}; ais.forEach((m) => (m.missedQuestions || []).forEach((q) => { (missed[q] ||= []).push(m.name.split(" ")[0]); }));
      const lawAIs = ais.filter((m) => m.lawsuitPct > 0).map((m) => m.name.split(" ")[0]);
      const verdict = ais.length ? `AIs know ${t} -- but they recommend ${esc(topPicks[0] ? topPicks[0].name : "a rival")}${lawAIs.length ? `, and ${esc([...new Set(lawAIs)].join(" and "))} brings up the lawsuit` : ""}.` : esc(plan.headline);

      content.innerHTML = `
        <h1>AI Visibility</h1>
        <div class="meta">What AI chatbots tell apartment owners who ask which software to buy -- and what ${t} should do about it. ${ais.length} AIs, ${answers} answers, tested ${esc(dates.join(" and "))}.</div>
        ${placeholderBanner(d.status)}
        <div class="verdict" id="last-run">${verdict}</div>

        <div class="stats-row">
          <div class="stat-card"><div class="value">${pct(stat.named)}</div><div class="label">Named when buyers don't ask for ${t}</div><div class="sub">across all ${ais.length} AIs</div></div>
          <div class="stat-card"><div class="value">${pct(stat.top)}</div><div class="label">Made ${t} the top pick</div><div class="sub">${esc(topPicks[0] ? topPicks[0].name : "--")} was top pick ${topPicks[0] ? topPicks[0].count : 0} times, ${t} ${(topPicks.find((p) => p.name === d.target) || { count: 0 }).count}</div></div>
          <div class="stat-card"><div class="value">${pct(stat.law)}</div><div class="label">Brought up the lawsuit</div><div class="sub">${lawAIs.length ? esc([...new Set(lawAIs)].join(", ")) + " only" : "no AI did"}</div></div>
          <div class="stat-card"><div class="value">${Object.keys(missed).length}</div><div class="label">Buyer questions where ${t} was left out</div><div class="sub">by at least one AI</div></div>
        </div>

        <h2>Each AI</h2>
        ${ais.length ? aiTable(ais, t) : ""}

        <h2>What to do next</h2>
        ${plan.groups.map((g) => `<div class="when">${esc(g.when)}</div>${g.actions.map(actionCard).join("")}`).join("")}

        <h2>Who the AIs pick instead</h2>
        <div class="card">
          <div class="chart-title muted note-gap-lg">Top pick when the buyer didn't name a brand, all AIs combined</div>
          ${topPicks.map((p) => `<div class="bar-row ${p.name === d.target ? "us" : ""}"><div>${esc(p.name)}</div><div class="track"><div class="fill" style="width:${(p.count / maxPick2) * 100}%"></div></div><div class="muted">${p.count}</div></div>`).join("")}
        </div>

        <h2>Questions where ${t} was left out</h2>
        <div class="card"><ul class="missed">${Object.entries(missed).map(([q, who]) => `<li>${esc(q)} <span class="muted">-- ${esc([...new Set(who)].join(", "))}</span></li>`).join("") || "<li>None -- named in every answer.</li>"}</ul></div>

        ${lawsuitSection(runs, ais)}
        ${trendSection(runs, t)}

        <h2>realpage.com checkup</h2>
        <div class="card"><ul class="facts">${plan.siteFacts.map((s) => `<li>${s.ok ? "✅" : "⚠️"} ${esc(s.text)}</li>`).join("")}</ul></div>

        <details class="evidence"><summary>Competitors and sources in the newest run</summary>
        <table>
          <thead><tr><th>Competitor</th><th>Named in</th><th>Recommended</th><th>Placed above ${t}</th><th>Avg place</th></tr></thead>
          <tbody>${d.competitors.map((c) => `<tr><td>${esc(c.name)} <span class="muted">${esc(c.domain)}</span></td><td>${pct(c.mentionPct)}</td><td>${c.recommendations}</td><td>${c.wins}</td><td>${rank(c.avgRank)}</td></tr>`).join("")}</tbody>
        </table>
        <table>
          <thead><tr><th>Site the AIs linked to</th><th>Kind</th><th>Links</th></tr></thead>
          <tbody>${d.sources.map((s) => `<tr><td>${esc(s.domain)}</td><td>${esc(s.type.replace(/_/g, " "))}</td><td>${s.count}</td></tr>`).join("") || `<tr><td colspan="3">No links in the answers.</td></tr>`}</tbody>
        </table>
        </details>

        <details class="evidence"><summary>Every question and answer in the newest run (${d.questions.length})</summary>
        <table>
          <thead><tr><th>Question</th><th>AI</th><th>Named ${t}?</th><th>Place</th><th>Top pick</th><th>Answer</th></tr></thead>
          <tbody>${d.questions.map((q) => `<tr><td>${esc(q.question)}${q.namesBrand ? ' <span class="muted">(asks about it by name)</span>' : ""}</td><td>${esc(q.name)}</td><td>${q.status !== "completed" ? "failed" : q.mentioned ? "Yes" : "No"}</td><td>${q.rank ? "#" + q.rank : "--"}</td><td>${esc(q.winner || "--")}</td><td class="ai-answer"><details><summary>Read</summary>${esc(q.answer)}</details></td></tr>`).join("")}</tbody>
        </table>
        </details>

        <h2>How this was measured</h2>
        <div class="card"><ul class="facts">
          <li class="muted">${esc(plan.basedOn)}</li>
          ${plan.caveats.map((c) => `<li class="muted">${esc(c)}</li>`).join("")}
        </ul></div>`;
    });
  </script>
</body>
</html>
