<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PropertyStack -- Software Share</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-panel.css" />
  <style>
    .share-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    @media (max-width: 900px) { .share-charts { grid-template-columns: 1fr; } }
    .chart-title { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
    .bar-row { display: grid; grid-template-columns: 130px 1fr 112px; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
    .bar-row:hover { background: #18181b; }
    .bar-row .name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-row .track { height: 12px; background: #18181b; border-radius: 3px; overflow: hidden; }
    .bar-row .fill { height: 100%; border-radius: 3px; }
    .bar-row .val { white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--text-muted); text-align: right; }
    #share-tbody tr { cursor: pointer; }
    #share-tbody tr:hover td { background: #18181b; }
    .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script src="js/chat-panel.js"></script>
  <script>
    renderShell("share");

    Promise.all([loadData("data/software-share.json"), loadData("data/properties.json")]).then(([data, props]) => {
      const content = document.getElementById("page-content");
      const share = [...data.share].sort((a, b) => b.properties - a.properties || b.units - a.units);
      const identified = share.reduce((sum, v) => sum + v.properties, 0);
      const identifiedUnits = share.reduce((sum, v) => sum + v.units, 0);
      const totalBuildings = props.stats.apartments;
      const pct = (n, d) => (d ? (100 * n / d).toFixed(1) : "0.0");
      const top = share[0];
      const second = share[1];
      const tableLink = (vendor) => `master-table.html?software=${encodeURIComponent(vendor)}`;

      function barChart(title, key, total, fmt) {
        const max = Math.max(...share.map((v) => v[key]));
        const rows = [...share].sort((a, b) => b[key] - a[key]);
        return `
          <div class="card">
            <div class="chart-title">${title}</div>
            ${rows.map((v) => `
              <div class="bar-row" data-vendor="${v.vendor}" title="${v.vendor}: ${fmt(v[key])} (${pct(v[key], total)}%) -- click to see these buildings">
                <div class="name">${v.vendor}</div>
                <div class="track"><div class="fill" style="width:${(100 * v[key] / max).toFixed(1)}%;background:${v.color};"></div></div>
                <div class="val">${fmt(v[key])} &middot; ${pct(v[key], total)}%</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      content.innerHTML = `
        <h1>Software Share</h1>
        <div class="meta">Which property-management software the identified buildings run. Generated from ${data.generatedFrom}. Click a vendor to see its buildings.</div>
        <div class="stats-row">
          <div class="stat-card"><div class="value">${identified} / ${totalBuildings}</div><div class="label">Identified (${pct(identified, totalBuildings)}%)</div></div>
          <div class="stat-card"><div class="value">${top ? top.vendor : "--"}</div><div class="label">Top vendor${top ? ` &middot; ${top.properties} buildings` : ""}</div></div>
          <div class="stat-card"><div class="value">${second ? second.vendor : "--"}</div><div class="label">2nd vendor${second ? ` &middot; ${second.properties} buildings` : ""}</div></div>
          <div class="stat-card"><div class="value">${top ? pct(top.properties, identified) + "%" : "--"}</div><div class="label">On ${top ? top.vendor : "top vendor"} (of identified)</div></div>
        </div>
        <div class="share-charts">
          ${barChart(`Share by # buildings (${identified} identified)`, "properties", identified, (n) => n)}
          ${barChart(`Share by # units (${identifiedUnits.toLocaleString()} units)`, "units", identifiedUnits, (n) => n.toLocaleString())}
        </div>
        <table>
          <thead><tr><th>Vendor</th><th>#</th><th>Units</th><th>%</th><th>Change since last run</th></tr></thead>
          <tbody id="share-tbody">
            ${share.map((v) => `
              <tr data-vendor="${v.vendor}">
                <td><span class="swatch" style="background:${v.color};"></span>${v.vendor}</td>
                <td>${v.properties}</td>
                <td>${v.units.toLocaleString()}</td>
                <td>${pct(v.properties, identified)}%</td>
                <td style="color:var(--text-dim);">N/A</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <div style="color:var(--text-dim);font-size:12px;margin-top:8px;">
          % = share of the ${identified} identified buildings. ${totalBuildings - identified} buildings are still unknown and not counted. Change since last run: N/A until a second run exists to compare against.
        </div>
      `;

      content.querySelectorAll("[data-vendor]").forEach((el) => {
        el.addEventListener("click", () => { location.href = tableLink(el.dataset.vendor); });
      });
    });
  </script>
</body>
</html>
