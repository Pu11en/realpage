<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>CraneSignal -- Property Detail</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-panel.css" />
  <style>
    .card h3 { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
    .kv dt { color: var(--text-dim); }
    .kv dd { margin: 0; word-break: break-word; }
    .card a, .sources a { color: var(--accent); }
    .dim { color: var(--text-dim); font-size: 13px; }
    .breakdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; text-align: center; }
    .breakdown .n { font-family: var(--mono); font-weight: 700; font-size: 16px; }
    .breakdown .label { font-size: 11px; color: var(--text-muted); }
    .sources ul { margin: 0; padding-left: 18px; font-size: 13px; }
    .sources li { margin-bottom: 6px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script src="js/chat-panel.js"></script>
  <script>
    renderShell(null); // detail page isn't one of the 4 tabs

    const id = new URLSearchParams(location.search).get("id");

    const STAGES = ["zoning-filed", "zoning-approved", "site-plan-approved", "permit", "under-construction", "leasing"];
    const STAGE_LABELS = {
      "zoning-filed": "Zoning filed", "zoning-approved": "Zoning approved", "site-plan-approved": "Site plan approved",
      "permit": "Permit", "under-construction": "Under construction", "leasing": "Leasing",
    };
    const STAGE_SHORT = ["Filed", "Zoned", "Plan", "Permit", "Build", "Lease"];

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function link(url, text) {
      return `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text || url)}</a>`;
    }
    function fmtDate(iso) {
      if (!iso) return "--";
      const d = new Date(iso + "T00:00:00");
      return isNaN(d) ? esc(iso) : d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }
    function scoreClass(score) {
      return score >= 70 ? "score-high" : score >= 40 ? "score-mid" : "score-low";
    }
    function sourceLabel(url) {
      if (url.includes("data.texas.gov")) return "County record";
      if (url.includes("legistar") || url.includes("zabalist.com") || url.includes("civicplus")) return "City filing";
      if (/communityimpact|dallasnews|candysdirt/.test(url)) return "News";
      return "Website";
    }

    function header(p, isUpcoming) {
      const bits = [
        p.address ? esc(p.address) : null,
        esc(p.city),
        p.county ? `${esc(p.county)} County` : null,
        p.units != null ? `${p.units} units` : "units not stated",
        isUpcoming ? "upcoming project" : `built ${p.yearBuilt ?? "?"}`,
      ].filter(Boolean);
      const who = isUpcoming ? `Developer: ${esc(p.developer || "not listed")}` : `Owner: ${esc(p.owner || "--")}`;
      return `
        <div class="back-row"><a class="back-link" href="index.html" onclick="if (history.length > 1 && document.referrer.startsWith(location.origin)) { history.back(); return false; }">&larr; Back</a></div>
        <h1>${esc(p.community)}</h1>
        <button class="btn deep-dive-btn detail-dive" data-deep-dive="${esc(p.id)}">Get contact &rarr;</button>
        <div class="meta">${bits.join(" &middot; ")}<br/>${who}</div>`;
    }

    function softwareCard(p, colors, isUpcoming) {
      if (isUpcoming) {
        return `<div class="card"><h3>Software</h3>
          <div class="pill-row">${vendorPill(null)}</div>
          <div class="dim">Not built yet -- no leasing website to check.</div></div>`;
      }
      const sw = p.software && p.software !== "unknown" ? p.software : null;
      const reason = { "no-website": "No website found", "no-portal-link": "Website has no portal link", "in-house-portal": "In-house / unrecognized portal" }[p.unknownReason];
      return `<div class="card"><h3>Software</h3>
        <div class="pill-row">${sw ? vendorPill(sw, colors) : `<span class="pill pill-unknown">Unknown</span>`}</div>
        <dl class="kv">
          <dt>Proof</dt><dd>${p.proof ? link(p.proof, "portal link") : "--"}</dd>
          <dt>Checked</dt><dd>${fmtDate(p.checkedAt)}</dd>
          <dt>Website</dt><dd>${p.website ? link(p.website, "open site") : "--"}</dd>
          <dt>Site confidence</dt><dd>${esc(p.websiteConfidence || "--")}</dd>
          ${!sw && reason ? `<dt>Why unknown</dt><dd>${reason}</dd>` : ""}
        </dl></div>`;
    }

    function signalsCard(p, isUpcoming) {
      if (isUpcoming) {
        const idx = STAGES.indexOf(p.stage);
        const dots = STAGES.map((s, i) => `<div class="dot ${i <= idx ? "done" : ""}"></div>`).join(`<div class="seg"></div>`);
        const labels = STAGE_SHORT.map((s) => `<div class="step-label">${s}</div>`).join("");
        return `<div class="card"><h3>Signals -- Upcoming</h3>
          <div class="timeline">${dots}</div>
          <div class="step-labels">${labels}</div>
          <dl class="kv">
            <dt>Stage</dt><dd>${esc(STAGE_LABELS[p.stage] || p.stage)}</dd>
            <dt>Stage date</dt><dd>${fmtDate(p.stageDate)}</dd>
            <dt>Expected open</dt><dd>${p.expectedOpen ? fmtDate(p.expectedOpen) : "not stated"}</dd>
            <dt>Developer</dt><dd>${esc(p.developer || "not listed")}</dd>
          </dl></div>`;
      }
      if (!p.sale) {
        return `<div class="card"><h3>Signals</h3><div class="dim">No recent sale and no upcoming-project signal for this building.</div></div>`;
      }
      return `<div class="card"><h3>Signals -- Sold</h3>
        <dl class="kv">
          <dt>Sale date</dt><dd>${fmtDate(p.sale.date)}</dd>
          <dt>New owner</dt><dd>${esc(p.sale.newOwner)}</dd>
          <dt>Previous owner</dt><dd>${esc(p.sale.previousOwner || "--")}</dd>
        </dl></div>`;
    }

    function leadCard(p) {
      const l = p.lead;
      if (!l) {
        return `<div class="card"><h3>Lead score</h3><div class="dim">Not a ranked lead (no sale or upcoming signal).</div></div>`;
      }
      const parts = [["Size", l.size], ["Timing", l.timing], ["Signal", l.signal], ["Open", l.open]]
        .map(([k, v]) => `<div><div class="n">${v}</div><div class="label">${k}</div></div>`).join("");
      return `<div class="card"><h3>Lead score</h3>
        <div class="score-row">
          <span class="score-badge score-badge-lg ${scoreClass(l.total)}">${l.total}</span>
          <span class="dim">Rank #${l.rank} of the lead list</span>
        </div>
        <div class="breakdown">${parts}</div>
        <div class="why">${esc(l.why)}</div></div>`;
    }

    function contactCard(p, isUpcoming) {
      const c = p.contact;
      let body;
      if (c && (c.phone || c.email)) {
        body = `<dl class="kv">
          <dt>Phone</dt><dd>${c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : "not found"}</dd>
          <dt>Email</dt><dd>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : "not found"}</dd>
        </dl>`;
      } else {
        const site = !isUpcoming && p.website ? `<br/>Try the website: ${link(p.website, "open site")}` : "";
        body = `<div class="dim">Phone/email not found.${site}</div>`;
      }
      return `<div class="card"><h3>Contact</h3>${body}</div>`;
    }

    // C4: a saved source is either {label, url} (built data), or an older plain
    // string/URL. Never show a raw query URL or an internal "[tag]".
    function sourceItem(s) {
      if (s && typeof s === "object") return { label: s.label || "Source", url: s.url || null };
      if (!s) return null;
      return /^https?:/.test(s) ? { label: sourceLabel(s), url: s } : { label: String(s).replace(/^\[|\]$/g, ""), url: null };
    }

    // T13: dedupe by URL alone when there is one -- the same link should never
    // show twice just because two entries gave it different labels (e.g. the
    // plain "website" field turning out to be the same page as a saved
    // "State project record" source).
    function sourceItems(list) {
      const out = [];
      const seen = new Set();
      (list || []).forEach((s) => {
        const e = sourceItem(s);
        const key = e ? (e.url ? `url|${e.url}` : `label|${e.label}`) : "";
        if (e && !seen.has(key)) { seen.add(key); out.push(e); }
      });
      return out;
    }

    function sourcesCard(p, isUpcoming) {
      const extra = [];
      if (!isUpcoming) { if (p.sale) extra.push(p.sale.source); extra.push(p.proof, p.website); }
      const items = sourceItems([...(p.sources || []), ...extra]);
      const list = items.map((e) => e.url
        ? `<li><span class="dim">${esc(e.label)}:</span> ${link(e.url)}</li>`
        : `<li>${esc(e.label)}</li>`);
      if (!isUpcoming) list.unshift(`<li><span class="dim">County record:</span> Collin County appraisal district (building, units, owner)</li>`);
      return `<div class="card sources"><h3>Sources</h3>
        <ul>${list.join("")}</ul></div>`;
    }

    // A lead row with no saved property record (Texas, Arizona, New York permits and sales).
    const LEAD_STAGE = { planned: "Planned", permitted: "Permitted", "under construction": "Under construction", leasing: "Leasing", sold: "Sold" };
    function leadPage(l, area) {
      const name = l.property || l.community || l.address || "Unnamed project";
      const sold = l.signalType === "Sold";
      const stage = LEAD_STAGE[l.stage] || l.signalType || "--";
      const sw = l.software ? vendorPill(l.software) : sold ? `<span class="pill pill-unknown">Unknown</span>` : vendorPill(null);
      const items = sourceItems([...(l.sources || []), ...Object.values(l.links || {})]);
      const sourceHtml = items.map((e) => e.url
        ? `<li><span class="dim">${esc(e.label)}:</span> ${link(e.url)}</li>`
        : `<li>${esc(e.label)}</li>`);
      const bits = [l.address ? esc(l.address) : null, esc(l.city), area ? esc(area.label) : null,
        l.units ? `${l.units} units` : "units not stated"].filter(Boolean);
      const who = sold ? `Buyer: ${esc(l.buyer || "not listed")}` : `Developer: ${esc(l.developer || "not listed")}`;
      return `
        <div class="back-row"><a class="back-link" href="index.html" onclick="if (history.length > 1 && document.referrer.startsWith(location.origin)) { history.back(); return false; }">&larr; Back</a></div>
        <h1>${esc(name)}</h1>
        <button class="btn deep-dive-btn detail-dive" data-deep-dive="${esc(l.id)}">Get contact &rarr;</button>
        <div class="meta">${bits.join(" &middot; ")}<br/>${who}</div>
        <div class="cards-row">
          <div class="card"><h3>Stage</h3><dl class="kv">
            <dt>Stage</dt><dd>${esc(stage)}</dd>
            <dt>Signal</dt><dd>${esc(l.signal || "--")}</dd>
            ${l.permitDate ? `<dt>Permit date</dt><dd>${fmtDate(l.permitDate)}</dd>` : ""}
            ${l.saleDate ? `<dt>Sale date</dt><dd>${fmtDate(l.saleDate)}</dd>` : ""}
            ${sold ? "" : `<dt>Expected open</dt><dd>${l.openingDate ? fmtDate(l.openingDate) : "not stated"}</dd>`}
          </dl></div>
          <div class="card"><h3>Software</h3><div class="pill-row">${sw}</div>
            ${!l.software && !sold ? `<div class="dim">Not built yet -- software not picked.</div>` : ""}</div>
          <div class="card"><h3>Lead score</h3>
            <div class="score-row"><span class="score-badge score-badge-lg ${scoreClass(l.score)}">${l.score}</span></div>
            <div class="why">${esc(l.why)}</div></div>
          <div class="card"><h3>Contact</h3>${l.officePhone
            ? `<dl class="kv"><dt>Phone</dt><dd><a href="tel:${esc(l.officePhone)}">${esc(l.officePhone)}</a></dd></dl>`
            : `<div class="dim">Phone/email not found.${l.website ? `<br/>Try the website: ${link(l.website, "open site")}` : ""}</div>`}</div>
        </div>
        <div class="card sources"><h3>Sources</h3><ul>${sourceHtml.join("") || `<li class="dim">No source saved.</li>`}</ul></div>`;
    }

    function showLead(hit) {
      const content = document.getElementById("page-content");
      const l = hit.lead;
      document.title = `CraneSignal -- ${l.property || l.address}`;
      content.innerHTML = leadPage(l, hit.area);
      content.querySelector("[data-deep-dive]").addEventListener("click", () => {
        window.PSChatPanel.deepDive(id, window.PSChatPanel.deepDivePrompt({
          name: l.property || l.address, city: l.city, units: l.units, software: l.software,
          stage: l.stage, signalType: l.signalType, buyer: l.buyer,
        }));
      });
    }

    loadData("data/properties.json").then(async (data) => {
      const content = document.getElementById("page-content");
      let p = data.properties.find((row) => row.id === id);
      let isUpcoming = false;
      if (!p) {
        p = (data.upcoming || []).find((row) => row.id === id);
        isUpcoming = !!p;
      }
      if (!p) {
        const hit = await findLead(id, new URLSearchParams(location.search).get("area")).catch(() => null);
        if (hit) { showLead(hit); return; }
      }
      if (!p) {
        content.innerHTML = `<h1>Property not found</h1>
          <div class="meta">No building or upcoming project with id "${esc(id)}".
          <a class="link" href="index.html">Back to Early Leads</a></div>`;
        return;
      }
      document.title = `CraneSignal -- ${p.community}`;
      content.innerHTML = `
        ${header(p, isUpcoming)}
        <div class="cards-row">
          ${softwareCard(p, data.vendorColors, isUpcoming)}
          ${signalsCard(p, isUpcoming)}
          ${leadCard(p)}
          ${contactCard(p, isUpcoming)}
        </div>
        ${sourcesCard(p, isUpcoming)}`;
      content.querySelector("[data-deep-dive]").addEventListener("click", () => {
        window.PSChatPanel.deepDive(id, window.PSChatPanel.deepDivePrompt({
          name: p.community, city: p.city, units: p.units, software: p.software,
          upcoming: isUpcoming, stage: isUpcoming ? p.stage : (p.sale ? "sold" : null),
          buyer: p.buyer || (p.sale && p.sale.newOwner),
        }));
      });
    });
  </script>
</body>
</html>
