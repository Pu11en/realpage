<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PropertyStack -- Property Detail</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script>
    renderShell(null); // detail page isn't one of the 4 tabs

    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    loadData("data/properties.json").then((data) => {
      const content = document.getElementById("page-content");
      const p = data.properties.find((row) => row.id === id) || data.properties[0];

      content.innerHTML = `
        <h1>${p.community}</h1>
        <div class="meta">${p.address}, ${p.city} &middot; ${p.units ?? "?"} units &middot; built ${p.yearBuilt ?? "?"}</div>
        <div class="cards-row">
          <div class="card">
            <div style="margin-bottom:10px;">${vendorPill(p.software, data.vendorColors)}</div>
            ${p.proof ? `<a href="${p.proof}" style="color:var(--accent);font-size:13px;">Proof link</a><br/>` : `<span style="color:var(--text-dim);font-size:13px;">No proof link yet</span><br/>`}
            <span class="pill" style="background:#22c55e22;color:#22c55e;margin-top:8px;display:inline-block;">Confidence: ${p.software ? "High" : "Unknown"}</span>
          </div>
          <div class="card">
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Signals -- placeholder until lead/signal data is built</div>
            <div class="timeline">
              <div class="dot"></div><div class="seg"></div>
              <div class="dot"></div><div class="seg"></div>
              <div class="dot"></div><div class="seg"></div>
              <div class="dot"></div><div class="seg"></div>
              <div class="dot"></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:6px;">
              <div class="step-label">Zoning</div><div class="step-label">Permit</div><div class="step-label">Construction</div><div class="step-label">Leasing</div><div class="step-label">Open</div>
            </div>
          </div>
          <div class="card">
            <div style="font-size:12px;color:var(--text-muted);">Lead score -- placeholder</div>
            <div style="font-size:28px;font-weight:700;font-family:var(--mono);">--</div>
          </div>
        </div>
        <div class="card" style="max-width:400px;">
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Sources</div>
          <ul style="margin:0;padding-left:18px;color:var(--text-muted);font-size:13px;">
            <li>Collin County appraisal district (public record)</li>
            ${p.proof ? `<li><a href="${p.proof}" style="color:var(--accent);">${p.proof}</a></li>` : ""}
          </ul>
        </div>
      `;
    });
  </script>
</body>
</html>
