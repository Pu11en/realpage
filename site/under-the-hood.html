<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>CraneSignal -- Under the Hood</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-panel.css" />
  <style>
    .section-title { font-size: 12px; color: var(--text-muted); margin: 24px 0 10px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; }
    .hero { padding: 8px 0 20px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
    .hero h1 { margin: 0 0 8px; font-size: 26px; }
    .hero .sub { color: var(--text-muted); font-size: 14px; max-width: 700px; line-height: 1.5; margin-bottom: 16px; }
    .ask-it-btn {
      font-family: var(--font-head); font-weight: 700; font-size: 15px; color: #fff;
      background: var(--accent); border: none; border-radius: 8px; padding: 12px 22px;
      cursor: pointer;
    }
    .ask-it-btn:hover { background: var(--blue-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      font-size: 12px; font-family: var(--mono); color: var(--ink-2); background: var(--paper-2);
      border: 1px solid var(--rule); border-radius: 14px; padding: 6px 12px; cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 8px; }
    .tile { border: 1px solid var(--rule); border-radius: 8px; padding: 14px; background: var(--paper); }
    .tile .n { font-family: var(--font-head); font-weight: 800; font-size: 26px; color: var(--ink); }
    .tile .label { font-size: 12px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.02em; }
    .tile .meta-line { font-size: 11px; color: var(--text-dim); margin-top: 6px; font-family: var(--mono); }
    .tile.notrun .n { color: var(--text-dim); font-size: 15px; font-weight: 600; font-family: var(--font); }
    .evidence-notice { border-left: 3px solid var(--accent); background: var(--paper-2); color: var(--ink-2); font-size: 13px; line-height: 1.5; margin: 0 0 18px; padding: 10px 12px; }
    .flow-svg { width: 100%; max-width: 760px; height: auto; display: block; margin: 0 auto; }
    .flow-caption { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 8px; }
    details.zone4 { border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 10px; background: var(--paper); }
    details.zone4 summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-family: var(--font-head); font-size: 14px; }
    details.zone4 summary:hover { color: var(--accent); }
    details.zone4 .body { padding: 0 14px 16px; font-size: 13px; line-height: 1.6; color: var(--ink-2); }
    details.zone4 ul { margin: 6px 0; padding-left: 18px; }
    details.zone4 table { width: 100%; }
    .example-card { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; margin: 8px 0; background: var(--paper-2); }
    .example-card .plan-tag { font-family: var(--mono); font-size: 11px; color: var(--accent); }
    .example-card .check-line { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .flow { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
    .flow .step { flex: 1 1 120px; border: 1px solid var(--rule); border-radius: 8px; padding: 12px; text-align: center; background: var(--paper-2); }
    .flow .n { font-family: var(--font-head); font-weight: 800; font-size: 24px; color: var(--ink); }
    .flow .label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .flow .skill { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 6px; }
    .flow .arrow { align-self: center; color: var(--text-dim); font-size: 18px; }
    @media (max-width: 900px) {
      .flow { display: grid; grid-template-columns: repeat(3, 1fr); }
      .flow .arrow { display: none; }
    }
    @media (max-width: 480px) {
      .flow { grid-template-columns: repeat(2, 1fr); }
    }
    .scroll { max-height: 420px; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
    .scroll table { margin: 0; }
    td.mono { font-family: var(--mono); font-size: 12px; }
    td.counts { font-family: var(--mono); font-size: 11px; color: var(--text-muted); max-width: 520px; }
    .ok { color: var(--ok); font-weight: 600; }
    .bad { color: var(--bad); font-weight: 600; }
    .card a, .dim a, td a { color: var(--accent); }
    .dim { color: var(--text-dim); font-size: 13px; line-height: 1.5; }
    .card ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
    .tag { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--rule); }
    .review-links { margin-top: 10px; }
    .review-note { margin-top: 6px; font-size: 11px; }
    .scroll tbody tr:nth-child(even) { background: var(--paper-2); }
    .scroll tr.clickable { cursor: pointer; }
    .scroll thead th { position: sticky; top: 0; background: var(--paper-2); }
    footer.uth-footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--text-dim); }
    footer.uth-footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script src="js/chat-panel.js"></script>
  <script>
    renderShell("hood");

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function siteLeadTotal(areas) {
      return (areas || []).reduce((n, a) => n + (a.leads || 0), 0);
    }
    function tile(n, label, metaLine) {
      return `<div class="tile"><div class="n">${esc(n)}</div><div class="label">${esc(label)}</div><div class="meta-line">${esc(metaLine || "")}</div></div>`;
    }
    function fmtDate(iso) {
      const d = new Date(`${iso}T12:00:00`);
      return isNaN(d) ? iso : d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function flowSVG() {
      const steps = ["Plan", "AI builds a step", "Checks run", "Human OK", "Live"];
      const w = 760, h = 110, boxW = 128, boxH = 56, gap = (w - steps.length * boxW) / (steps.length - 1);
      const boxes = steps.map((label, i) => {
        const bx = i * (boxW + gap);
        return `
          <rect x="${bx}" y="${(h - boxH) / 2}" width="${boxW}" height="${boxH}" rx="8"
                fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1"/>
          <text x="${bx + boxW / 2}" y="${h / 2 + 4}" text-anchor="middle"
                font-size="12" font-family="Inter, sans-serif" fill="var(--ink)">${esc(label)}</text>`;
      }).join("");
      const arrows = steps.slice(0, -1).map((_, i) => {
        const startX = i * (boxW + gap) + boxW;
        const endX = startX + gap;
        const y = h / 2;
        return `<line x1="${startX + 4}" y1="${y}" x2="${endX - 6}" y2="${y}" stroke="var(--text-dim)" stroke-width="1.5" marker-end="url(#arrowhead)"/>`;
      }).join("");
      return `
        <svg class="flow-svg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="var(--text-dim)"/>
            </marker>
          </defs>
          ${arrows}
          ${boxes}
        </svg>`;
    }

    Promise.all([
      loadData("data/pipeline.json"),
      loadData("data/areas/index.json"),
      loadData("data/buildbot.json").catch(() => null),
      loadData("data/evals.json"),
      loadData("data/chat-stats.json"),
    ]).then(([pipeline, index, buildbot, evals, chatStats]) => {
      const content = document.getElementById("page-content");
      const ft = evals.failure_types;
      const review = evals.human_review;
      const offTopic = ft.types.find((t) => t.type === "scope-creep");
      const vague = ft.types.find((t) => t.type.startsWith("ambiguous"));
      const areas = index.areas.filter((a) => (a.leads || 0) >= 50);
      const total = siteLeadTotal(index.areas);
      const sample = pipeline.steps.filter((s) => s.name !== "score-leads");
      const found = pipeline.steps.find((s) => s.name === "find-apartments");
      const detected = pipeline.steps.find((s) => s.name === "detect-software");
      const unknownPct = found && detected ? Math.round((1 - detected.count / found.count) * 100) : null;

      content.innerHTML = `
        <section class="hero">
          <h1>How CraneSignal was built and tested.</h1>
          <div class="sub">CraneSignal is a sales research assistant for property-software teams. It finds apartment
            buildings, works out which software they run, spots recent sales and new projects, and answers questions
            about all of it in plain English. Try the agent yourself; the rest of this page shows how we know it works.</div>
          <button class="ask-it-btn" data-chat-toggle>Ask it</button>
          <div class="chips">
            <span class="chip" data-q="What are people on Reddit saying about RealPage?">What are people on Reddit saying about RealPage?</span>
            <span class="chip" data-q="Which Texas buildings just sold and might switch software?">Which Texas buildings just sold and might switch software?</span>
            <span class="chip" data-q="Who should I call first in Dallas, and why?">Who should I call first in Dallas, and why?</span>
          </div>
        </section>

        <div class="section-title">By the numbers</div>
        <div class="tiles">
          ${tile(`${ft.ok_count} / ${ft.n}`, "test questions answered correctly", "fixed test set incl. trick questions")}
          ${tile(`${Math.round(review.agreement_pct)}%`, "AI grader matches a human", `on the ${review.n_reviewed} hardest cases`)}
          ${tile(`~${Math.round(chatStats.median_seconds)}s`, "typical answer time", `95% within ${Math.round(chatStats.p95_seconds)}s`)}
          ${tile("10 / 10", "software matches confirmed by hand", "each proof link opened to the vendor")}
        </div>
        <div class="dim">Measured ${esc(fmtDate(evals.measured_at))} on ${ft.n} graded answers and ${chatStats.n_answers} timed answers.</div>

        <div class="section-title">How it gets built</div>
        ${flowSVG()}
        <div class="flow-caption">Every change is small, checked automatically, and approved by a person before it goes live.</div>

        <div class="section-title">Details</div>

        <details class="zone4" open>
          <summary>How I build with AI</summary>
          <div class="body">
            <ul>
              <li><b>Plan first.</b> Work is written up as a plan of small steps, each small enough to finish and check in one sitting${buildbot ? ` (${buildbot.plans} plans, ${buildbot.steps_done} steps so far)` : ""}.</li>
              <li><b>Isolated copies.</b> The AI never works in the real code directly -- every task runs in its own copy.</li>
              <li><b>A check gates every step.</b> Each plan names an automatic check (tests, a build, or loading the page), and it runs after every step before anything is trusted.</li>
              <li><b>A person approves.</b> A human tries the change and approves it before it reaches the live site.</li>
              <li><b>Publishing is human-only.</b> The AI never pushes code or deploys on its own.</li>
            </ul>
            <div class="example-card">
              <div class="plan-tag">Example step</div>
              <div><b>Task:</b> make the chat panel load reliably every time.</div>
              <div class="dim"><b>Check:</b> an automatic test confirms the chat waits long enough to load and shows a clear message if it can't.
                <b>Result:</b> passed, tried by a person, then released.</div>
            </div>
          </div>
        </details>

        <details class="zone4">
          <summary>How I know it's good</summary>
          <div class="body">
            <ul>
              <li><b>A fixed test set.</b> ${ft.n} questions a sales rep would really ask, plus trick questions: off-topic trivia, requests to change data, and attempts to talk it out of its rules.</li>
              <li><b>Graded against a rubric.</b> An AI grader scores every answer: is it correct, sourced from our data, and within scope? ${ft.ok_count} of ${ft.n} passed.</li>
              <li><b>The grader is checked too.</b> I graded the ${review.n_reviewed} hardest cases by hand; the AI grader agreed with me on ${Math.round(review.agreement_pct)}% of them.</li>
              <li><b>The data is spot-checked by hand.</b> 10 of 10 software matches held up -- every proof link opened to the named vendor's portal. A review of "no website" rows found real misses; after fixes, buildings without a trusted website dropped from 67 to about 18.</li>
            </ul>
          </div>
        </details>

        <details class="zone4">
          <summary>Safety</summary>
          <div class="body">
            <ul>
              <li><b>Read-only.</b> The agent cannot change, add or delete data. Asked to, it says so.</li>
              <li><b>No invented links.</b> Every link in an answer must come from our data or a page it actually read that turn.</li>
              <li><b>Never guesses.</b> Software, owners and contacts are only stated with a proof source; unknowns are said plainly.</li>
              <li><b>No personal data.</b> Sign-in identities and resident data never appear in an answer.</li>
              <li><b>Standard web protections.</b> The site sends the usual browser security headers, and every page and data file requires sign-in.</li>
            </ul>
          </div>
        </details>

        <details class="zone4">
          <summary>Known limits</summary>
          <div class="body">
            <ul>
              ${offTopic ? `<li><b>Off-topic questions.</b> In ${offTopic.count} of ${ft.n} tests it answered trivia (e.g. "${esc(offTopic.example_question)}") instead of politely steering back. Harmless, but not ideal.</li>` : ""}
              ${vague ? `<li><b>Vague questions.</b> In ${vague.count} test it answered a vague question instead of asking what was meant.</li>` : ""}
              ${unknownPct != null ? `<li><b>Not every building shows its software.</b> For about ${unknownPct}% of buildings in our sample, nothing public names the software. Those are marked "unknown" rather than guessed.</li>` : ""}
              <li><b>Coverage.</b> Leads today are strongest in ${areas.map((a) => esc(a.label)).join(" and ")}; any other US area can be added with the same lead finder.</li>
            </ul>
          </div>
        </details>

        <details class="zone4">
          <summary>How the lead finder works</summary>
          <div class="body">
            <div class="meta">Each stage is its own small program that saves its work, so any stage can be re-run or checked on its own.
              The numbers below are from our first sample area (Plano and Richardson, Texas). Across the whole site there are
              <b>${total.toLocaleString()}</b> leads.</div>
            <div class="section-title">Plano &amp; Richardson sample</div>
            <div class="flow">
              ${sample.map((s, i) => `
                ${i ? '<div class="arrow">&rarr;</div>' : ""}
                <div class="step">
                  <div class="n">${s.count ?? "--"}</div>
                  <div class="label">${esc(s.label)}</div>
                </div>
              `).join("")}
            </div>
          </div>
        </details>

        <footer class="uth-footer">
          Build bot code: <a href="https://github.com/Pu11en/ebi-agent-chat-relay" target="_blank" rel="noopener">github.com/Pu11en/ebi-agent-chat-relay</a>
        </footer>
      `;

      content.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          const q = chip.getAttribute("data-q");
          if (window.PSChatPanel && window.PSChatPanel.deepDive) {
            window.PSChatPanel.deepDive(q);
          } else if (window.PSChatPanel) {
            window.PSChatPanel.open();
          }
        });
      });
    });
  </script>
</body>
</html>
