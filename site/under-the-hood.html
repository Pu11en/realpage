<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PropertyStack -- Under the Hood</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell" id="app-shell"></div>
  <script src="js/app.js"></script>
  <script>
    renderShell("hood");

    loadData("data/pipeline.json").then((data) => {
      const content = document.getElementById("page-content");
      content.innerHTML = `
        <h1>Under the Hood</h1>
        <div class="meta">How the agent works.</div>
        ${placeholderBanner(data.status)}
        <div class="funnel" style="margin-top:0;margin-bottom:20px;">
          ${data.steps.map((s) => `
            <div class="step"><div class="n">${s.count ?? "--"}</div><div class="label">${s.name}</div></div>
          `).join("")}
        </div>
        <table style="margin-bottom:20px;">
          <thead><tr><th>Run ID</th><th>Area</th><th>Properties</th><th>% Identified</th><th>Cost</th><th>Duration</th><th>Models</th></tr></thead>
          <tbody>
            ${data.runs.map((r) => `
              <tr>
                <td>${r.runId}</td><td>${r.area}</td><td>${r.propertiesProcessed}</td>
                <td>${r.pctIdentified}%</td><td>${r.costUsd ?? "--"}</td><td>${r.durationSec ?? "--"}</td><td>${r.models}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <div class="cards-row">
          <div class="card">
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Accuracy (latest hand-check)</div>
            <div style="font-size:24px;font-weight:700;font-family:var(--mono);">${data.accuracy.correct} of ${data.accuracy.total}</div>
            <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${data.accuracy.note}</div>
          </div>
          <div class="card">
            <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Cost per area</div>
            <div style="font-size:24px;font-weight:700;font-family:var(--mono);">--</div>
            <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${data.costPerArea.note}</div>
          </div>
        </div>
        <div class="card" style="opacity:0.6;">
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">Review queue (read-only) -- ${data.reviewQueue.status}</div>
          <div style="font-size:12px;color:var(--text-dim);">Fixed in a local session, not on the site.</div>
        </div>
      `;
    });
  </script>
</body>
</html>
