# Local trial of the full chat: PropertyStack bot (Hermes + proxy) + Open WebUI.
# Run from the repo root:
#   docker compose -f chatbot/docker-compose.local.yml --env-file chatbot/.env.local -p ps-chat up -d --build
# (create chatbot/.env.local from GOOGLE-SIGNIN.md; once the Google keys are in, also put
#  ENABLE_SIGNUP=false and ENABLE_LOGIN_FORM=false in it so only the Google button shows)
# Then open http://localhost:3000 (Open WebUI) — first account created is admin.
# DEEPSEEK_API_KEY must be in your shell environment.
services:
  chatbot:
    build:
      context: ..
      dockerfile: chatbot/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PORT: "8080"
      API_SERVER_HOST: "0.0.0.0"          # reachable by open-webui on the compose network
      API_SERVER_KEY: ${HERMES_API_KEY:-local-trial-key-change-me}
      CHAT_ALLOWED_ORIGINS: http://localhost:8765
    ports:
      - "18080:8080"                      # the old /chat proxy for the site's quick panel
      # Hermes' 8642 is NOT published: only open-webui can reach it.
    volumes:
      - hermes-home:/opt/data
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on: [chatbot]
    environment:
      WEBUI_NAME: PropertyStack
      OPENAI_API_BASE_URL: http://chatbot:8642/v1
      OPENAI_API_KEY: ${HERMES_API_KEY:-local-trial-key-change-me}
      ENABLE_OLLAMA_API: "false"
      # Sign-in: Google only (keys from chatbot/.env.local, see GOOGLE-SIGNIN.md).
      # Until the keys exist, password login stays on so the local trial still works.
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      ENABLE_LOGIN_FORM: ${ENABLE_LOGIN_FORM:-true}
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/oauth/google/callback}
      DEFAULT_USER_ROLE: user
      DEFAULT_MODELS: hermes-agent
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [{"title": ["Which vendor", "runs the most buildings?"], "content": "Which vendor runs the most buildings?"},
         {"title": ["What software", "has the highest satisfaction score?"], "content": "What software has the highest satisfaction score?"},
         {"title": ["Summarize", "the top complaints in reviews"], "content": "Summarize the top complaints in the reviews data"}]
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-local-trial-secret}
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
      # PropertyStack branding (green sparkle, dark bg) over Open WebUI's default logo/favicon.
      - ./branding/favicon.png:/app/build/favicon.png:ro
      - ./branding/favicon.png:/app/build/static/favicon.png:ro
      - ./branding/favicon-96x96.png:/app/build/static/favicon-96x96.png:ro
      - ./branding/favicon.svg:/app/build/static/favicon.svg:ro
      - ./branding/logo.png:/app/build/static/logo.png:ro
      - ./branding/logo-transparent.png:/app/build/static/splash.png:ro
volumes:
  hermes-home:
  open-webui:
